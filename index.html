<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>gameShelf</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: #1a1a2e;
    color: #e0e0e0;
    min-height: 100vh;
  }
  /* Navbar */
  .navbar {
    position: sticky;
    top: 0;
    z-index: 100;
    background: #16213e;
    padding: 16px 32px;
    display: flex;
    align-items: center;
    box-shadow: 0 2px 12px rgba(0,0,0,0.5);
    border-bottom: 2px solid #0f3460;
  }
  .navbar .logo {
    font-size: 28px;
    font-weight: 800;
    background: linear-gradient(135deg, #e94560, #f5a623);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: 1px;
  }
  /* Main Content */
  .main {
    max-width: 1200px;
    margin: 0 auto;
    padding: 40px 20px;
  }
  .section-title {
    font-size: 24px;
    margin-bottom: 24px;
    color: #e94560;
    font-weight: 700;
  }
  /* Game Grid */
  .game-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 24px;
  }
  @media (max-width: 1023px) {
    .game-grid { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 767px) {
    .game-grid { grid-template-columns: 1fr; }
  }
  /* Game Card */
  .game-card {
    background: #16213e;
    border-radius: 16px;
    overflow: hidden;
    cursor: pointer;
    transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    border: 2px solid transparent;
    text-decoration: none;
    color: inherit;
    display: block;
  }
  .game-card:hover {
    transform: scale(1.04);
    box-shadow: 0 0 24px rgba(233, 69, 96, 0.4);
    border-color: #e94560;
  }
  .game-card .thumb {
    width: 100%;
    aspect-ratio: 16/9;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 48px;
    position: relative;
    overflow: hidden;
  }
  .game-card .thumb::after {
    content: '▶';
    position: absolute;
    font-size: 40px;
    color: #fff;
    background: rgba(233, 69, 96, 0.85);
    width: 64px;
    height: 64px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transition: opacity 0.2s ease;
  }
  .game-card:hover .thumb::after { opacity: 1; }
  .game-card .card-body {
    padding: 16px;
  }
  .game-card .card-body h3 {
    font-size: 18px;
    margin-bottom: 6px;
    color: #fff;
  }
  .game-card .card-body p {
    font-size: 14px;
    color: #a0a0b8;
    line-height: 1.4;
  }
  /* Footer */
  .footer {
    text-align: center;
    padding: 40px 20px;
    color: #555;
    font-size: 13px;
  }
</style>
</head>
<body>
  <nav class="navbar">
    <div class="logo">gameShelf</div>
  </nav>

  <div class="main">
    <h2 class="section-title">Popular Games</h2>
    <div class="game-grid" id="gameGrid"></div>
  </div>

  <div class="footer">
    &copy; 2025 gameShelf — All games run in your browser.
  </div>

<script>
// Game catalog — add new games to this array without changing HTML structure
const games = [
  {
    slug: 'tetris',
    title: 'Tetris',
    description: 'Classic block-stacking puzzle',
    thumbBg: 'linear-gradient(135deg, #00b4d8, #0077b6)',
    thumbIcon: '🧱'
  }
  // Add more games here as they are built
];

const grid = document.getElementById('gameGrid');
games.forEach(game => {
  const a = document.createElement('a');
  a.href = game.slug + '/index.html';
  a.className = 'game-card';
  a.innerHTML =
    '<div class="thumb" style="background:' + game.thumbBg + '">' +
      '<span>' + game.thumbIcon + '</span>' +
    '</div>' +
    '<div class="card-body">' +
      '<h3>' + game.title + '</h3>' +
      '<p>' + game.description + '</p>' +
    '</div>';
  grid.appendChild(a);
});
</script>
</body>
</html>
