<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>2048 — gameShelf</title>
    <style>
        /* ========================================
           2048 Game Styles
           ======================================== */

        /* Reset */
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: #0f0f23;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            -webkit-user-select: none;
            user-select: none;
        }

        /* Site Header Bar */
        .game-header {
            width: 100%;
            background: rgba(15, 15, 35, 0.95);
            border-bottom: 1px solid #2a2a5a;
            padding: 0.75rem 1.25rem;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .game-header-inner {
            max-width: 700px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            color: #a0a0b8;
            font-size: 0.9rem;
            font-weight: 500;
            text-decoration: none;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: #fbbf24;
        }

        .back-link::before {
            content: '←';
            font-size: 1.1rem;
        }

        .game-title-header {
            font-size: 1.4rem;
            font-weight: 800;
            background: linear-gradient(135deg, #fbbf24, #d97706);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* Game Container */
        .game-container {
            max-width: 420px;
            width: 95%;
            margin: 1.5rem auto 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
        }

        /* Score Board */
        .score-board {
            display: flex;
            gap: 0.75rem;
            width: 100%;
        }

        .score-box {
            flex: 1;
            background: linear-gradient(135deg, #fbbf24, #d97706);
            color: #1a1a3e;
            border-radius: 0.5rem;
            padding: 0.5rem 1rem;
            text-align: center;
            box-shadow: 0 2px 8px rgba(251, 191, 36, 0.25);
        }

        .score-label {
            font-size: 0.65rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.8;
        }

        .score-value {
            font-size: 1.4rem;
            font-weight: 800;
            line-height: 1.2;
        }

        /* Game Controls Bar */
        .controls-bar {
            display: flex;
            gap: 0.5rem;
            width: 100%;
        }

        .btn-new-game {
            flex: 1;
            background: linear-gradient(135deg, #fbbf24, #d97706);
            color: #1a1a3e;
            border: none;
            border-radius: 0.5rem;
            padding: 0.6rem 1rem;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 2px 8px rgba(251, 191, 36, 0.25);
        }

        .btn-new-game:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(251, 191, 36, 0.35);
        }

        .btn-new-game:active {
            transform: translateY(0);
        }

        /* Game Board */
        .board-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 1;
            border-radius: 0.75rem;
            overflow: hidden;
            background: #1e1e45;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            touch-action: none;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 8px;
            padding: 8px;
            width: 100%;
            height: 100%;
            position: relative;
        }

        .board-bg {
            position: absolute;
            inset: 0;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 8px;
            padding: 8px;
            pointer-events: none;
        }

        .board-cell {
            border-radius: 0.5rem;
            background: rgba(30, 30, 69, 0.6);
        }

        /* Tiles */
        .tile-layer {
            position: absolute;
            inset: 8px;
            pointer-events: none;
        }

        .tile {
            position: absolute;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            border-radius: 0.5rem;
            transition: transform 0.1s ease-in-out;
            z-index: 1;
        }

        .tile.new-tile {
            animation: tile-pop 0.15s ease-in-out;
        }

        .tile.merged-tile {
            animation: tile-merge 0.2s ease-in-out;
            z-index: 2;
        }

        @keyframes tile-pop {
            0% { transform: scale(0); }
            60% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }

        @keyframes tile-merge {
            0% { transform: scale(1); }
            40% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        /* Tile Colors — Classic 2048 Palette */
        .tile-2 {
            background: #eee4da;
            color: #776e65;
        }
        .tile-4 {
            background: #ede0c8;
            color: #776e65;
        }
        .tile-8 {
            background: #f2b179;
            color: #f9f6f2;
        }
        .tile-16 {
            background: #f59563;
            color: #f9f6f2;
        }
        .tile-32 {
            background: #f67c5f;
            color: #f9f6f2;
        }
        .tile-64 {
            background: #f65e3b;
            color: #f9f6f2;
        }
        .tile-128 {
            background: #edcf72;
            color: #f9f6f2;
            font-size: 1.6rem !important;
        }
        .tile-256 {
            background: #edcc61;
            color: #f9f6f2;
            font-size: 1.6rem !important;
        }
        .tile-512 {
            background: #edc850;
            color: #f9f6f2;
            font-size: 1.6rem !important;
        }
        .tile-1024 {
            background: #edc53f;
            color: #f9f6f2;
            font-size: 1.3rem !important;
        }
        .tile-2048 {
            background: linear-gradient(135deg, #fbbf24, #d97706);
            color: #f9f6f2;
            font-size: 1.3rem !important;
            box-shadow: 0 0 20px rgba(251, 191, 36, 0.5);
        }
        .tile-super {
            background: #3c3a32;
            color: #f9f6f2;
            font-size: 1.1rem !important;
        }

        /* Overlay (Game Over / Win) */
        .overlay {
            position: absolute;
            inset: 0;
            background: rgba(15, 15, 35, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 0.75rem;
            z-index: 10;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .overlay-title {
            font-size: 2.2rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #fbbf24, #d97706);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .overlay-subtitle {
            font-size: 1rem;
            color: #a0a0b8;
            margin-bottom: 1.5rem;
        }

        .overlay-score {
            font-size: 2.5rem;
            font-weight: 800;
            color: #fbbf24;
            margin-bottom: 1.5rem;
        }

        .overlay-btn {
            background: linear-gradient(135deg, #fbbf24, #d97706);
            color: #1a1a3e;
            border: none;
            border-radius: 0.5rem;
            padding: 0.7rem 2rem;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 2px 8px rgba(251, 191, 36, 0.25);
        }

        .overlay-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(251, 191, 36, 0.35);
        }

        /* Footer */
        .game-footer {
            text-align: center;
            color: #6b6b80;
            font-size: 0.75rem;
            padding: 1rem;
        }

        /* Responsive — Mobile */
        @media (max-width: 500px) {
            .game-container {
                width: 100%;
                margin: 1rem 0 1.5rem;
                padding: 0 0.5rem;
            }

            .board {
                gap: 6px;
                padding: 6px;
            }

            .board-bg {
                gap: 6px;
                padding: 6px;
            }

            .tile-layer {
                inset: 6px;
            }

            .tile {
                border-radius: 0.4rem;
            }

            .tile-128, .tile-256, .tile-512 {
                font-size: 1.4rem !important;
            }

            .tile-1024 {
                font-size: 1.15rem !important;
            }

            .tile-2048, .tile-super {
                font-size: 1.1rem !important;
            }

            .score-value {
                font-size: 1.2rem;
            }

            .overlay-title {
                font-size: 1.8rem;
            }

            .overlay-score {
                font-size: 2rem;
            }
        }

        @media (max-width: 360px) {
            .board {
                gap: 5px;
                padding: 5px;
            }

            .board-bg {
                gap: 5px;
                padding: 5px;
            }

            .tile-layer {
                inset: 5px;
            }

            .tile-128, .tile-256, .tile-512 {
                font-size: 1.2rem !important;
            }

            .tile-1024, .tile-2048, .tile-super {
                font-size: 1rem !important;
            }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="game-header">
        <div class="game-header-inner">
            <a href="../index.html" class="back-link">Home</a>
            <span class="game-title-header">2048</span>
            <div style="width: 60px;"></div>
        </div>
    </header>

    <!-- Game -->
    <div class="game-container">
        <!-- Score Board -->
        <div class="score-board">
            <div class="score-box">
                <div class="score-label">Score</div>
                <div class="score-value" id="score">0</div>
            </div>
            <div class="score-box">
                <div class="score-label">Best</div>
                <div class="score-value" id="best-score">0</div>
            </div>
        </div>

        <!-- Controls -->
        <div class="controls-bar">
            <button class="btn-new-game" id="btn-new-game">⟳ New Game</button>
        </div>

        <!-- Board -->
        <div class="board-wrapper" id="board-wrapper">
            <div class="board" id="board"></div>
            <div class="board-bg" id="board-bg"></div>
            <div class="tile-layer" id="tile-layer"></div>

            <!-- Game Over Overlay -->
            <div class="overlay" id="overlay-gameover">
                <div class="overlay-title">Game Over!</div>
                <div class="overlay-subtitle">No more moves available</div>
                <div class="overlay-score" id="overlay-score-gameover">0</div>
                <button class="overlay-btn" id="btn-play-again">Play Again</button>
            </div>

            <!-- Win Overlay -->
            <div class="overlay" id="overlay-win">
                <div class="overlay-title">🎉 You Win!</div>
                <div class="overlay-subtitle">You reached 2048!</div>
                <button class="overlay-btn" id="btn-keep-playing" style="margin-bottom:0.5rem;">Keep Playing</button>
                <button class="overlay-btn" id="btn-new-win">New Game</button>
            </div>
        </div>
    </div>

    <div class="game-footer">
        Use arrow keys or swipe to play · Merge tiles to reach 2048!
    </div>

    <script>
    (function() {
        'use strict';

        // ========== Constants ==========
        const SIZE = 4;
        const GAP = 8;
        const PADDING = 8;
        const ANIM_DURATION = 100;

        // ========== DOM References ==========
        const boardEl = document.getElementById('board');
        const boardBgEl = document.getElementById('board-bg');
        const tileLayerEl = document.getElementById('tile-layer');
        const scoreEl = document.getElementById('score');
        const bestScoreEl = document.getElementById('best-score');
        const btnNewGame = document.getElementById('btn-new-game');
        const btnPlayAgain = document.getElementById('btn-play-again');
        const btnKeepPlaying = document.getElementById('btn-keep-playing');
        const btnNewWin = document.getElementById('btn-new-win');
        const overlayGameOver = document.getElementById('overlay-gameover');
        const overlayWin = document.getElementById('overlay-win');
        const overlayScoreGameover = document.getElementById('overlay-score-gameover');
        const boardWrapper = document.getElementById('board-wrapper');

        // ========== Game State ==========
        let grid = [];
        let score = 0;
        let bestScore = parseInt(localStorage.getItem('2048-best')) || 0;
        let gameOver = false;
        let won = false;
        let keepPlaying = false;
        let tiles = {}; // id -> tile object
        let tileIdCounter = 0;
        let animating = false;

        // ========== Helpers ==========
        function getCellSize() {
            const rect = boardWrapper.getBoundingClientRect();
            const boardInner = rect.width - (PADDING * 2) - (GAP * (SIZE - 1));
            return Math.floor(boardInner / SIZE);
        }

        function getTilePos(row, col) {
            const cellSize = getCellSize();
            return {
                x: col * (cellSize + GAP),
                y: row * (cellSize + GAP),
                size: cellSize
            };
        }

        function randomEmptyCell() {
            const empty = [];
            for (let r = 0; r < SIZE; r++) {
                for (let c = 0; c < SIZE; c++) {
                    if (grid[r][c] === null) empty.push({ r, c });
                }
            }
            if (empty.length === 0) return null;
            return empty[Math.floor(Math.random() * empty.length)];
        }

        function spawnTile() {
            const pos = randomEmptyCell();
            if (!pos) return;
            const value = Math.random() < 0.9 ? 2 : 4;
            grid[pos.r][pos.c] = value;
            const id = tileIdCounter++;
            tiles[id] = { value, r: pos.r, c: pos.c, id, isNew: true, merged: false };
            renderTile(id);
        }

        // ========== Tile Rendering ==========
        function renderTile(id) {
            const tile = tiles[id];
            if (!tile) return;

            // Remove existing DOM for this id
            const existing = document.getElementById('tile-' + id);
            if (existing) existing.remove();

            const pos = getTilePos(tile.r, tile.c);
            const el = document.createElement('div');
            el.id = 'tile-' + id;
            el.classList.add('tile');
            el.classList.add(getTileClass(tile.value));

            // Font size based on value length
            const text = String(tile.value);
            const len = text.length;
            if (len <= 2) el.style.fontSize = '1.8rem';
            else if (len <= 3) el.style.fontSize = '1.5rem';
            else if (len <= 4) el.style.fontSize = '1.2rem';
            else el.style.fontSize = '1rem';

            // Position
            el.style.width = pos.size + 'px';
            el.style.height = pos.size + 'px';
            el.style.left = pos.x + 'px';
            el.style.top = pos.y + 'px';

            el.textContent = text;

            if (tile.isNew) {
                el.classList.add('new-tile');
                tile.isNew = false;
            }

            if (tile.merged) {
                el.classList.add('merged-tile');
                tile.merged = false;
            }

            tileLayerEl.appendChild(el);
        }

        function updateTilePosition(id, r, c) {
            const tile = tiles[id];
            if (!tile) return;
            tile.r = r;
            tile.c = c;
            const pos = getTilePos(r, c);
            const el = document.getElementById('tile-' + id);
            if (el) {
                el.style.width = pos.size + 'px';
                el.style.height = pos.size + 'px';
                el.style.left = pos.x + 'px';
                el.style.top = pos.y + 'px';
            }
        }

        function removeTile(id) {
            const el = document.getElementById('tile-' + id);
            if (el) el.remove();
            delete tiles[id];
        }

        function clearAllTiles() {
            tileLayerEl.innerHTML = '';
            tiles = {};
            tileIdCounter = 0;
        }

        function getTileClass(value) {
            if (value <= 2048) return 'tile-' + value;
            return 'tile-super';
        }

        // ========== Board Setup ==========
        function setupBoard() {
            boardEl.innerHTML = '';
            boardBgEl.innerHTML = '';
            for (let i = 0; i < SIZE * SIZE; i++) {
                const cell = document.createElement('div');
                cell.classList.add('board-cell');
                boardBgEl.appendChild(cell);
            }
            const cellSize = getCellSize();
            boardBgEl.style.gridTemplateColumns = `repeat(${SIZE}, ${cellSize}px)`;
            boardBgEl.style.gridTemplateRows = `repeat(${SIZE}, ${cellSize}px)`;
        }

        // ========== Game Logic ==========
        function initGrid() {
            grid = [];
            for (let r = 0; r < SIZE; r++) {
                grid[r] = new Array(SIZE).fill(null);
            }
        }

        function init() {
            initGrid();
            score = 0;
            gameOver = false;
            won = false;
            keepPlaying = false;
            animating = false;
            overlayGameOver.classList.remove('active');
            overlayWin.classList.remove('active');
            updateScoreDisplay();
            setupBoard();

            // Place 2 initial tiles
            spawnTile();
            spawnTile();
        }

        function isMoveValid() {
            // Check for empty cells
            for (let r = 0; r < SIZE; r++) {
                for (let c = 0; c < SIZE; c++) {
                    if (grid[r][c] === null) return true;
                }
            }
            // Check for adjacent matching tiles
            for (let r = 0; r < SIZE; r++) {
                for (let c = 0; c < SIZE; c++) {
                    const val = grid[r][c];
                    if (c < SIZE - 1 && grid[r][c + 1] === val) return true;
                    if (r < SIZE - 1 && grid[r + 1][c] === val) return true;
                }
            }
            return false;
        }

        function move(direction) {
            if (gameOver || animating) return;

            // Save old state
            const oldGrid = grid.map(row => [...row]);

            // Clear merged flags
            for (let r = 0; r < SIZE; r++) {
                for (let c = 0; c < SIZE; c++) {
                    if (grid[r][c] !== null) {
                        for (const id in tiles) {
                            if (tiles[id].r === r && tiles[id].c === c) {
                                tiles[id].merged = false;
                            }
                        }
                    }
                }
            }

            let moved = false;
            let mergeScore = 0;

            // Determine processing order
            const processed = Array.from({ length: SIZE }, () => new Array(SIZE).fill(false));

            if (direction === 'left' || direction === 'right') {
                const order = direction === 'left' ? [0, 1, 2, 3] : [3, 2, 1, 0];
                for (let r = 0; r < SIZE; r++) {
                    let line = [];
                    for (let c = 0; c < SIZE; c++) {
                        if (grid[r][c] !== null) {
                            line.push({ value: grid[r][c], r: r, c: c });
                        }
                    }
                    let result = processLine(line, direction === 'right');
                    // Write back
                    let col = direction === 'left' ? 0 : SIZE - 1;
                    const step = direction === 'left' ? 1 : -1;
                    for (let i = 0; i < result.length; i++) {
                        const targetC = col + i * step;
                        grid[r][targetC] = result[i].value;
                        // Update tile positions
                        if (result[i].oldId) {
                            updateTilePosition(result[i].oldId, r, targetC);
                            processed[r][targetC] = true;
                        }
                        if (result[i].newId) {
                            processed[r][targetC] = true;
                        }
                    }
                    // Null out remaining
                    for (let c = 0; c < SIZE; c++) {
                        if (processed[r][c] === false) {
                            // Clear old tile references
                        }
                    }
                }
            } else {
                const order = direction === 'up' ? [0, 1, 2, 3] : [3, 2, 1, 0];
                for (let c = 0; c < SIZE; c++) {
                    let line = [];
                    for (let r = 0; r < SIZE; r++) {
                        if (grid[r][c] !== null) {
                            line.push({ value: grid[r][c], r: r, c: c });
                        }
                    }
                    let result = processLine(line, direction === 'down');
                    // Write back
                    let row = direction === 'up' ? 0 : SIZE - 1;
                    const step = direction === 'up' ? 1 : -1;
                    for (let i = 0; i < result.length; i++) {
                        const targetR = row + i * step;
                        grid[targetR][c] = result[i].value;
                        if (result[i].oldId) {
                            updateTilePosition(result[i].oldId, targetR, c);
                            processed[targetR][c] = true;
                        }
                    }
                }
            }

            // Check if anything changed
            for (let r = 0; r < SIZE; r++) {
                for (let c = 0; c < SIZE; c++) {
                    if (oldGrid[r][c] !== grid[r][c]) {
                        moved = true;
                    }
                }
            }

            if (!moved) return;

            // Clean up removed tiles
            cleanupRemovedTiles(oldGrid);

            animating = true;

            setTimeout(() => {
                spawnTile();
                animating = false;

                // Check win
                if (!won && !keepPlaying) {
                    for (let r = 0; r < SIZE; r++) {
                        for (let c = 0; c < SIZE; c++) {
                            if (grid[r][c] === 2048) {
                                won = true;
                                overlayWin.classList.add('active');
                                return;
                            }
                        }
                    }
                }

                // Check game over
                if (!isMoveValid()) {
                    gameOver = true;
                    overlayScoreGameover.textContent = score;
                    overlayGameOver.classList.add('active');
                }
            }, ANIM_DURATION);
        }

        function processLine(line, reverse) {
            if (!reverse) {
                return mergeLine(line);
            } else {
                // For reverse direction, process normally then map back
                const reversedLine = line.slice().reverse();
                const result = mergeLine(reversedLine);
                return result;
            }
        }

        function mergeLine(line) {
            let result = [];
            let i = 0;
            while (i < line.length) {
                if (i + 1 < line.length && line[i].value === line[i + 1].value) {
                    // Merge
                    const mergedValue = line[i].value * 2;
                    score += mergedValue;
                    if (score > bestScore) {
                        bestScore = score;
                        localStorage.setItem('2048-best', bestScore);
                    }
                    updateScoreDisplay();

                    // Create new merged tile
                    const newId = tileIdCounter++;
                    // Keep the first tile's id for movement animation
                    const keepId = line[i].id;
                    const removeId = line[i + 1].id;

                    tiles[newId] = {
                        value: mergedValue,
                        r: line[i].r,
                        c: line[i].c,
                        id: newId,
                        isNew: false,
                        merged: true,
                        keepId: keepId,
                        removeId: removeId
                    };

                    result.push({ value: mergedValue, newId: newId, oldId: keepId });
                    i += 2;
                } else {
                    result.push({ value: line[i].value, oldId: line[i].id });
                    i++;
                }
            }
            return result;
        }

        function cleanupRemovedTiles(oldGrid) {
            // Find tiles that no longer exist
            for (const id in tiles) {
                const t = tiles[id];
                if (t.keepId) {
                    // This tile is a merge result; remove the old tiles
                    removeTile(t.keepId);
                    if (t.removeId) removeTile(t.removeId);
                }
            }
            // Also remove any tiles whose value at their position changed
            for (const id in tiles) {
                const t = tiles[id];
                if (t.keepId || t.removeId) continue;
                if (grid[t.r][t.c] !== t.value) {
                    // This tile was consumed by a merge (shouldn't normally happen after cleanup)
                    removeTile(id);
                }
            }
            // Remove tiles that are no longer on the grid
            const gridTiles = new Set();
            for (let r = 0; r < SIZE; r++) {
                for (let c = 0; c < SIZE; c++) {
                    if (grid[r][c] !== null) {
                        for (const id in tiles) {
                            if (tiles[id].r === r && tiles[id].c === c && tiles[id].value === grid[r][c]) {
                                gridTiles.add(id);
                            }
                        }
                    }
                }
            }
            for (const id in tiles) {
                if (!gridTiles.has(id) && !tiles[id].keepId) {
                    removeTile(id);
                }
            }
        }

        function updateScoreDisplay() {
            scoreEl.textContent = score;
            bestScoreEl.textContent = bestScore;
        }

        // ========== Controls ==========
        function handleDirection(dir) {
            move(dir);
        }

        document.addEventListener('keydown', function(e) {
            switch (e.key) {
                case 'ArrowUp': e.preventDefault(); handleDirection('up'); break;
                case 'ArrowDown': e.preventDefault(); handleDirection('down'); break;
                case 'ArrowLeft': e.preventDefault(); handleDirection('left'); break;
                case 'ArrowRight': e.preventDefault(); handleDirection('right'); break;
            }
        });

        // Touch/Swipe handling
        let touchStartX = 0;
        let touchStartY = 0;
        let touchStartTime = 0;
        const SWIPE_THRESHOLD = 30;

        boardWrapper.addEventListener('touchstart', function(e) {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
            touchStartTime = Date.now();
        }, { passive: true });

        boardWrapper.addEventListener('touchmove', function(e) {
            e.preventDefault();
        }, { passive: false });

        boardWrapper.addEventListener('touchend', function(e) {
            const dx = e.changedTouches[0].clientX - touchStartX;
            const dy = e.changedTouches[0].clientY - touchStartY;
            const elapsed = Date.now() - touchStartTime;

            if (elapsed > 500) return;

            const absDx = Math.abs(dx);
            const absDy = Math.abs(dy);

            if (Math.max(absDx, absDy) < SWIPE_THRESHOLD) return;

            if (absDx > absDy) {
                if (dx > 0) handleDirection('right');
                else handleDirection('left');
            } else {
                if (dy > 0) handleDirection('down');
                else handleDirection('up');
            }
        });

        // ========== Buttons ==========
        btnNewGame.addEventListener('click', init);
        btnPlayAgain.addEventListener('click', init);
        btnNewWin.addEventListener('click', init);
        btnKeepPlaying.addEventListener('click', function() {
            keepPlaying = true;
            overlayWin.classList.remove('active');
        });

        // ========== Resize Handler ==========
        let resizeTimeout;
        window.addEventListener('resize', function() {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(function() {
                setupBoard();
                // Re-render all tiles at new sizes
                for (const id in tiles) {
                    const t = tiles[id];
                    updateTilePosition(id, t.r, t.c);
                }
            }, 100);
        });

        // ========== Start ==========
        init();

    })();
    </script>
</body>
</html>
