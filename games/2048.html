<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>2048 — gameShelf</title>
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: #0f0f23;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            -webkit-user-select: none;
            user-select: none;
        }

        .game-header {
            width: 100%;
            background: rgba(15, 15, 35, 0.95);
            border-bottom: 1px solid #2a2a5a;
            padding: 0.75rem 1.25rem;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .game-header-inner {
            max-width: 700px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            color: #a0a0b8;
            font-size: 0.9rem;
            font-weight: 500;
            text-decoration: none;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: #fbbf24;
        }

        .back-link::before {
            content: '←';
            font-size: 1.1rem;
        }

        .game-title-header {
            font-size: 1.4rem;
            font-weight: 800;
            background: linear-gradient(135deg, #fbbf24, #d97706);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .game-container {
            max-width: 420px;
            width: 95%;
            margin: 1.5rem auto 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
        }

        .score-board {
            display: flex;
            gap: 0.75rem;
            width: 100%;
        }

        .score-box {
            flex: 1;
            background: linear-gradient(135deg, #fbbf24, #d97706);
            color: #1a1a3e;
            border-radius: 0.5rem;
            padding: 0.5rem 1rem;
            text-align: center;
            box-shadow: 0 2px 8px rgba(251, 191, 36, 0.25);
        }

        .score-label {
            font-size: 0.65rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.8;
        }

        .score-value {
            font-size: 1.4rem;
            font-weight: 800;
            line-height: 1.2;
        }

        .controls-bar {
            display: flex;
            gap: 0.5rem;
            width: 100%;
        }

        .btn-new-game {
            flex: 1;
            background: linear-gradient(135deg, #fbbf24, #d97706);
            color: #1a1a3e;
            border: none;
            border-radius: 0.5rem;
            padding: 0.6rem 1rem;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 2px 8px rgba(251, 191, 36, 0.25);
        }

        .btn-new-game:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(251, 191, 36, 0.35);
        }

        .btn-new-game:active {
            transform: translateY(0);
        }

        .board-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 1;
            border-radius: 0.75rem;
            overflow: hidden;
            background: #1e1e45;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            touch-action: none;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 8px;
            padding: 8px;
            width: 100%;
            height: 100%;
            position: relative;
        }

        .board-bg {
            position: absolute;
            inset: 0;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 8px;
            padding: 8px;
            pointer-events: none;
        }

        .board-cell {
            border-radius: 0.5rem;
            background: rgba(30, 30, 69, 0.6);
        }

        .tile-layer {
            position: absolute;
            inset: 8px;
            pointer-events: none;
        }

        .tile {
            position: absolute;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            border-radius: 0.5rem;
            transition: transform 0.1s ease-in-out;
            z-index: 1;
        }

        .tile.new-tile {
            animation: tile-pop 0.15s ease-in-out;
        }

        .tile.merged-tile {
            animation: tile-merge 0.2s ease-in-out;
            z-index: 2;
        }

        @keyframes tile-pop {
            0% { transform: scale(0); }
            60% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }

        @keyframes tile-merge {
            0% { transform: scale(1); }
            40% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        .tile-2 { background: #eee4da; color: #776e65; }
        .tile-4 { background: #ede0c8; color: #776e65; }
        .tile-8 { background: #f2b179; color: #f9f6f2; }
        .tile-16 { background: #f59563; color: #f9f6f2; }
        .tile-32 { background: #f67c5f; color: #f9f6f2; }
        .tile-64 { background: #f65e3b; color: #f9f6f2; }
        .tile-128 { background: #edcf72; color: #f9f6f2; font-size: 1.6rem !important; }
        .tile-256 { background: #edcc61; color: #f9f6f2; font-size: 1.6rem !important; }
        .tile-512 { background: #edc850; color: #f9f6f2; font-size: 1.6rem !important; }
        .tile-1024 { background: #edc53f; color: #f9f6f2; font-size: 1.3rem !important; }
        .tile-2048 { background: linear-gradient(135deg, #fbbf24, #d97706); color: #f9f6f2; font-size: 1.3rem !important; box-shadow: 0 0 20px rgba(251, 191, 36, 0.5); }
        .tile-super { background: #3c3a32; color: #f9f6f2; font-size: 1.1rem !important; }

        .overlay {
            position: absolute;
            inset: 0;
            background: rgba(15, 15, 35, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 0.75rem;
            z-index: 10;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .overlay-title {
            font-size: 2.2rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #fbbf24, #d97706);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .overlay-subtitle {
            font-size: 1rem;
            color: #a0a0b8;
            margin-bottom: 1.5rem;
        }

        .overlay-score {
            font-size: 2.5rem;
            font-weight: 800;
            color: #fbbf24;
            margin-bottom: 1.5rem;
        }

        .overlay-btn {
            background: linear-gradient(135deg, #fbbf24, #d97706);
            color: #1a1a3e;
            border: none;
            border-radius: 0.5rem;
            padding: 0.7rem 2rem;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 2px 8px rgba(251, 191, 36, 0.25);
            margin: 0.25rem;
        }

        .overlay-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(251, 191, 36, 0.35);
        }

        .game-footer {
            text-align: center;
            color: #6b6b80;
            font-size: 0.75rem;
            padding: 1rem;
        }

        @media (max-width: 500px) {
            .game-container {
                width: 100%;
                margin: 1rem 0 1.5rem;
                padding: 0 0.5rem;
            }
            .board { gap: 6px; padding: 6px; }
            .board-bg { gap: 6px; padding: 6px; }
            .tile-layer { inset: 6px; }
            .tile { border-radius: 0.4rem; }
            .tile-128, .tile-256, .tile-512 { font-size: 1.4rem !important; }
            .tile-1024 { font-size: 1.15rem !important; }
            .tile-2048, .tile-super { font-size: 1.1rem !important; }
            .score-value { font-size: 1.2rem; }
            .overlay-title { font-size: 1.8rem; }
            .overlay-score { font-size: 2rem; }
        }

        @media (max-width: 360px) {
            .board { gap: 5px; padding: 5px; }
            .board-bg { gap: 5px; padding: 5px; }
            .tile-layer { inset: 5px; }
            .tile-128, .tile-256, .tile-512 { font-size: 1.2rem !important; }
            .tile-1024, .tile-2048, .tile-super { font-size: 1rem !important; }
        }
    </style>
</head>
<body>
    <header class="game-header">
        <div class="game-header-inner">
            <a href="../index.html" class="back-link">Home</a>
            <span class="game-title-header">2048</span>
            <div style="width: 60px;"></div>
        </div>
    </header>

    <div class="game-container">
        <div class="score-board">
            <div class="score-box">
                <div class="score-label">Score</div>
                <div class="score-value" id="score">0</div>
            </div>
            <div class="score-box">
                <div class="score-label">Best</div>
                <div class="score-value" id="best-score">0</div>
            </div>
        </div>

        <div class="controls-bar">
            <button class="btn-new-game" id="btn-new-game">⟳ New Game</button>
        </div>

        <div class="board-wrapper" id="board-wrapper">
            <div class="board" id="board"></div>
            <div class="board-bg" id="board-bg"></div>
            <div class="tile-layer" id="tile-layer"></div>

            <div class="overlay" id="overlay-gameover">
                <div class="overlay-title">Game Over!</div>
                <div class="overlay-subtitle">No more moves available</div>
                <div class="overlay-score" id="overlay-score-gameover">0</div>
                <button class="overlay-btn" id="btn-play-again">Play Again</button>
            </div>

            <div class="overlay" id="overlay-win">
                <div class="overlay-title">🎉 You Win!</div>
                <div class="overlay-subtitle">You reached 2048!</div>
                <button class="overlay-btn" id="btn-keep-playing">Keep Playing</button>
                <button class="overlay-btn" id="btn-new-win">New Game</button>
            </div>
        </div>
    </div>

    <div class="game-footer">
        Use arrow keys or swipe to play · Merge tiles to reach 2048!
    </div>

    <script>
    (function() {
        'use strict';

        const SIZE = 4;
        const GAP = 8;
        const PADDING = 8;

        const boardEl = document.getElementById('board');
        const boardBgEl = document.getElementById('board-bg');
        const tileLayerEl = document.getElementById('tile-layer');
        const scoreEl = document.getElementById('score');
        const bestScoreEl = document.getElementById('best-score');
        const btnNewGame = document.getElementById('btn-new-game');
        const btnPlayAgain = document.getElementById('btn-play-again');
        const btnKeepPlaying = document.getElementById('btn-keep-playing');
        const btnNewWin = document.getElementById('btn-new-win');
        const overlayGameOver = document.getElementById('overlay-gameover');
        const overlayWin = document.getElementById('overlay-win');
        const overlayScoreGameover = document.getElementById('overlay-score-gameover');
        const boardWrapper = document.getElementById('board-wrapper');

        let grid = [];
        let score = 0;
        let bestScore = parseInt(localStorage.getItem('2048-best')) || 0;
        let gameOver = false;
        let won = false;
        let keepPlaying = false;
        let tiles = {};
        let tileIdCounter = 0;

        function getCellSize() {
            const rect = boardWrapper.getBoundingClientRect();
            const boardInner = rect.width - (PADDING * 2) - (GAP * (SIZE - 1));
            return Math.max(55, Math.floor(boardInner / SIZE));
        }

        function getTilePos(row, col) {
            const cellSize = getCellSize();
            return {
                x: col * (cellSize + GAP),
                y: row * (cellSize + GAP),
                size: cellSize
            };
        }

        function getTileClass(value) {
            if (value <= 2048) return 'tile-' + value;
            return 'tile-super';
        }

        function setTextSize(el, value) {
            const text = String(value);
            const len = text.length;
            if (len <= 2) el.style.fontSize = '1.8rem';
            else if (len <= 3) el.style.fontSize = '1.5rem';
            else if (len <= 4) el.style.fontSize = '1.2rem';
            else el.style.fontSize = '1rem';
        }

        function createTileDOM(id, isNew) {
            const tile = tiles[id];
            const el = document.createElement('div');
            el.id = 'tile-' + id;
            el.classList.add('tile');
            el.classList.add(getTileClass(tile.value));
            if (isNew) el.classList.add('new-tile');
            setTextSize(el, tile.value);
            el.textContent = tile.value;
            const pos = getTilePos(tile.r, tile.c);
            el.style.width = pos.size + 'px';
            el.style.height = pos.size + 'px';
            el.style.left = pos.x + 'px';
            el.style.top = pos.y + 'px';
            tileLayerEl.appendChild(el);
        }

        function moveTileDOM(id) {
            const tile = tiles[id];
            const el = document.getElementById('tile-' + id);
            if (!el) return;
            const pos = getTilePos(tile.r, tile.c);
            el.style.width = pos.size + 'px';
            el.style.height = pos.size + 'px';
            el.style.left = pos.x + 'px';
            el.style.top = pos.y + 'px';
        }

        function removeTileDOM(id) {
            const el = document.getElementById('tile-' + id);
            if (el) el.remove();
        }

        function randomEmptyCell() {
            const empty = [];
            for (let r = 0; r < SIZE; r++)
                for (let c = 0; c < SIZE; c++)
                    if (grid[r][c] === null) empty.push({ r, c });
            if (empty.length === 0) return null;
            return empty[Math.floor(Math.random() * empty.length)];
        }

        function spawnTile() {
            const pos = randomEmptyCell();
            if (!pos) return;
            const value = Math.random() < 0.9 ? 2 : 4;
            const id = tileIdCounter++;
            grid[pos.r][pos.c] = { id, value };
            tiles[id] = { id, r: pos.r, c: pos.c, value, isNew: true };
            createTileDOM(id, true);
        }

        function setupBoard() {
            boardBgEl.innerHTML = '';
            for (let i = 0; i < SIZE * SIZE; i++) {
                const cell = document.createElement('div');
                cell.classList.add('board-cell');
                boardBgEl.appendChild(cell);
            }
            const cellSize = getCellSize();
            boardBgEl.style.gridTemplateColumns = `repeat(${SIZE}, ${cellSize}px)`;
            boardBgEl.style.gridTemplateRows = `repeat(${SIZE}, ${cellSize}px)`;
        }

        function updateScoreDisplay() {
            scoreEl.textContent = score;
            bestScoreEl.textContent = bestScore;
        }

        function isGameOver() {
            for (let r = 0; r < SIZE; r++)
                for (let c = 0; c < SIZE; c++) {
                    if (grid[r][c] === null) return false;
                    const v = grid[r][c].value;
                    if (c < SIZE - 1 && grid[r][c + 1] && grid[r][c + 1].value === v) return false;
                    if (r < SIZE - 1 && grid[r + 1][c] && grid[r + 1][c].value === v) return false;
                }
            return true;
        }

        function hasAnyMove() {
            for (let r = 0; r < SIZE; r++) {
                for (let c = 0; c < SIZE; c++) {
                    if (grid[r][c] === null) return true;
                    const v = grid[r][c].value;
                    if (c < SIZE - 1 && grid[r][c + 1] && grid[r][c + 1].value === v) return true;
                    if (r < SIZE - 1 && grid[r + 1][c] && grid[r + 1][c].value === v) return true;
                }
            }
            return false;
        }

        /*
         * Core movement algorithm:
         * We process each row/column independently. For each line, we extract the
         * non-null tile objects, merge adjacent equal values, then place them back.
         *
         * The trick is: we need to animate tile movements by tracking old DOM elements
         * to their new positions.
         */
        function move(dir) {
            if (gameOver) return;

            // Extract lines based on direction
            const lines = [];
            for (let i = 0; i < SIZE; i++) {
                const line = [];
                for (let j = 0; j < SIZE; j++) {
                    let r, c;
                    if (dir === 'left' || dir === 'right') { r = i; c = j; }
                    else { r = j; c = i; }
                    line.push(grid[r][c]);
                }
                // If right or down, reverse the line
                if (dir === 'right' || dir === 'down') line.reverse();
                lines.push(line);
            }

            // Process each line
            let moved = false;
            const newGrid = grid.map(row => row.slice());
            const merges = []; // track merge operations

            for (let i = 0; i < SIZE; i++) {
                let line = lines[i];
                const target = [];
                let skipNext = false;

                for (let j = 0; j < SIZE; j++) {
                    if (skipNext) { skipNext = false; continue; }

                    if (line[j] === null) continue;

                    if (j + 1 < SIZE && line[j] && line[j + 1] && line[j].value === line[j + 1].value) {
                        // Merge
                        const mergedValue = line[j].value * 2;
                        score += mergedValue;
                        if (score > bestScore) {
                            bestScore = score;
                            localStorage.setItem('2048-best', bestScore);
                        }

                        const oldId1 = line[j].id;
                        const oldId2 = line[j + 1].id;
                        const newId = tileIdCounter++;

                        const targetIdx = target.length;
                        target.push({ id: newId, value: mergedValue });

                        // Record merge info
                        merges.push({
                            id1: oldId1, id2: oldId2,
                            newId: newId,
                            r: dir === 'up' ? targetIdx : (dir === 'down' ? (SIZE - 1 - targetIdx) : lines[i].length - 1 - targetIdx),
                            c: dir === 'left' ? targetIdx : (dir === 'right' ? (SIZE - 1 - targetIdx) : i)
                        });

                        // Update grid position in newGrid
                        const gr = dir === 'up' || dir === 'down' ? i : targetIdx;
                        const gc = dir === 'left' || dir === 'right' ? targetIdx : i;
                        // For rows/cols, we need proper mapping
                        skipNext = true;
                    } else {
                        target.push(line[j]);
                    }
                }

                // Fill remaining with nulls
                while (target.length < SIZE) target.push(null);

                // Write back to newGrid with direction mapping
                for (let j = 0; j < SIZE; j++) {
                    let r, c;
                    if (dir === 'left' || dir === 'right') {
                        r = i; c = j;
                    } else {
                        r = j; c = i;
                    }
                    // If direction is right/down, reverse
                    if (dir === 'right') c = SIZE - 1 - j;
                    if (dir === 'down') r = SIZE - 1 - j;
                    newGrid[r][c] = target[j];
                }
            }

            // Check if grid changed
            for (let r = 0; r < SIZE; r++) {
                for (let c = 0; c < SIZE; c++) {
                    const oldVal = grid[r][c];
                    const newVal = newGrid[r][c];
                    if (!oldVal && !newVal) continue;
                    if ((oldVal && !newVal) || (!oldVal && newVal)) { moved = true; continue; }
                    if (oldVal.id !== newVal.id) { moved = true; }
                    if (oldVal.value !== newVal.value) { moved = true; }
                }
            }

            if (!moved) return;

            grid = newGrid;

            // Perform animations
            // 1. Remove tiles that were merged (the consumed ones)
            const removedIds = new Set();
            for (const m of merges) {
                removedIds.add(m.id1);
                removedIds.add(m.id2);
            }

            // 2. Update positions of non-merged, non-removed tiles
            for (const id in tiles) {
                if (removedIds.has(parseInt(id))) continue;
                const tile = tiles[id];
                if (tile.r !== undefined && tile.c !== undefined) {
                    moveTileDOM(parseInt(id));
                }
            }

            // 3. Create merged tiles after animation delay
            setTimeout(() => {
                // Remove old tiles
                for (const id of removedIds) {
                    removeTileDOM(id);
                    delete tiles[id];
                }
                // Create new merged tiles
                for (const m of merges) {
                    tiles[m.newId] = { id: m.newId, r: m.r, c: m.c, value: grid[m.r][m.c].value, merged: true };
                    createTileDOM(m.newId, false);
                    // Add merge animation after the DOM element is created
                    setTimeout(() => {
                        const el = document.getElementById('tile-' + m.newId);
                        if (el) {
                            el.classList.add('merged-tile');
                        }
                    }, 10);
                }
                updateScoreDisplay();

                // Check win
                if (!won && !keepPlaying) {
                    let found2048 = false;
                    for (let r = 0; r < SIZE; r++)
                        for (let c = 0; c < SIZE; c++)
                            if (grid[r][c] && grid[r][c].value === 2048) found2048 = true;
                    if (found2048) {
                        won = true;
                        overlayWin.classList.add('active');
                        return;
                    }
                }

                // Check game over
                if (!hasAnyMove()) {
                    gameOver = true;
                    overlayScoreGameover.textContent = score;
                    overlayGameOver.classList.add('active');
                }
            }, 110);
        }

        function init() {
            grid = [];
            for (let r = 0; r < SIZE; r++)
                grid[r] = new Array(SIZE).fill(null);

            score = 0;
            gameOver = false;
            won = false;
            keepPlaying = false;
            tiles = {};
            tileIdCounter = 0;
            overlayGameOver.classList.remove('active');
            overlayWin.classList.remove('active');
            updateScoreDisplay();
            setupBoard();
            spawnTile();
            spawnTile();
        }

        // Keyboard
        document.addEventListener('keydown', function(e) {
            switch (e.key) {
                case 'ArrowUp': e.preventDefault(); move('up'); break;
                case 'ArrowDown': e.preventDefault(); move('down'); break;
                case 'ArrowLeft': e.preventDefault(); move('left'); break;
                case 'ArrowRight': e.preventDefault(); move('right'); break;
            }
        });

        // Touch/Swipe
        let touchStartX = 0, touchStartY = 0, touchStartTime = 0;
        const SWIPE_THRESHOLD = 30;

        boardWrapper.addEventListener('touchstart', function(e) {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
            touchStartTime = Date.now();
        }, { passive: true });

        boardWrapper.addEventListener('touchmove', function(e) {
            e.preventDefault();
        }, { passive: false });

        boardWrapper.addEventListener('touchend', function(e) {
            const dx = e.changedTouches[0].clientX - touchStartX;
            const dy = e.changedTouches[0].clientY - touchStartY;
            if (Date.now() - touchStartTime > 500) return;
            if (Math.max(Math.abs(dx), Math.abs(dy)) < SWIPE_THRESHOLD) return;
            if (Math.abs(dx) > Math.abs(dy)) {
                move(dx > 0 ? 'right' : 'left');
            } else {
                move(dy > 0 ? 'down' : 'up');
            }
        });

        // Buttons
        btnNewGame.addEventListener('click', init);
        btnPlayAgain.addEventListener('click', init);
        btnNewWin.addEventListener('click', init);
        btnKeepPlaying.addEventListener('click', function() {
            keepPlaying = true;
            overlayWin.classList.remove('active');
        });

        // Resize
        let resizeTimeout;
        window.addEventListener('resize', function() {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(function() {
                setupBoard();
                for (const id in tiles) moveTileDOM(parseInt(id));
            }, 100);
        });

        init();
    })();
    </script>
</body>
