<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>gameShelf — Whack-a-Mole</title>
    <style>
        :root {
            --bg-primary: #0f0f23;
            --bg-secondary: #1a1a3e;
            --bg-card: #1e1e45;
            --text-primary: #e0e0e0;
            --text-secondary: #a0a0b8;
            --text-muted: #6b6b80;
            --accent: #00d4ff;
            --accent-hover: #00b8d9;
            --accent-glow: rgba(0, 212, 255, 0.3);
            --border-color: #2a2a5a;
            --header-bg: rgba(15, 15, 35, 0.95);
            --footer-bg: #0a0a1a;
            --mole-color: #8B4513;
            --mole-dark: #654321;
            --grass-color: #2d5a1e;
            --hole-color: #1a1a3e;
        }

        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .game-header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: var(--header-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            padding: 0.75rem 1.5rem;
        }

        .header-inner {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: var(--accent);
            text-shadow: 0 0 10px var(--accent-glow);
            white-space: nowrap;
        }

        .logo:hover {
            text-shadow: 0 0 20px var(--accent-glow), 0 0 40px rgba(0, 212, 255, 0.1);
        }

        .logo::before {
            content: '🎮';
            margin-right: 0.35rem;
        }

        .game-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .back-link {
            color: var(--accent);
            font-size: 0.9rem;
            font-weight: 500;
            transition: color 0.2s ease;
            white-space: nowrap;
        }

        .back-link:hover {
            color: var(--accent-hover);
            text-shadow: 0 0 10px var(--accent-glow);
        }

        .game-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem 1.5rem;
        }

        .hud-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 2rem;
            margin-bottom: 1.5rem;
            padding: 0.5rem 1.5rem;
            background: var(--bg-secondary);
            border: 2px solid var(--border-color);
            border-radius: 0.5rem;
            min-width: 400px;
        }

        .hud-item {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .canvas-wrapper {
            position: relative;
            border: 2px solid var(--border-color);
            border-radius: 0.75rem;
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.1), 0 8px 24px rgba(0, 0, 0, 0.5);
            overflow: hidden;
        }

        canvas {
            display: block;
            background-color: var(--grass-color);
            cursor: crosshair;
        }

        .overlay {
            position: absolute;
            inset: 0;
            background: rgba(15, 15, 35, 0.92);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            z-index: 10;
            border-radius: 0.75rem;
            transition: opacity 0.3s ease;
        }

        .overlay.hidden {
            display: none;
        }

        .overlay-title {
            font-size: 2rem;
            font-weight: 800;
            color: var(--text-primary);
            text-shadow: 0 0 20px var(--accent-glow);
        }

        .overlay-subtitle {
            font-size: 0.95rem;
            color: var(--text-secondary);
            text-align: center;
            max-width: 280px;
            line-height: 1.5;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            background: var(--accent);
            color: var(--bg-primary);
            font-size: 1rem;
            font-weight: 700;
            padding: 0.5rem 2rem;
            border-radius: 0.75rem;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.15);
            margin-top: 0.5rem;
        }

        .btn:hover {
            background: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .site-footer {
            margin-top: auto;
            background: var(--footer-bg);
            border-top: 1px solid var(--border-color);
            padding: 2rem 1.5rem;
        }

        .footer-inner {
            max-width: 1200px;
            margin: 0 auto;
            text-align: center;
        }

        .footer-links {
            display: flex;
            justify-content: center;
            gap: 3rem;
            margin-bottom: 0.5rem;
        }

        .footer-links a {
            color: var(--text-muted);
            font-size: 0.85rem;
            transition: color 0.2s ease;
        }

        .footer-links a:hover {
            color: var(--accent);
        }

        .site-footer p {
            color: var(--text-muted);
            font-size: 0.8rem;
        }

        @media (max-width: 480px) {
            .header-inner {
                justify-content: center;
                text-align: center;
            }
            .hud-bar {
                min-width: 320px;
                gap: 0.5rem;
            }
            .overlay-title {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <header class="game-header">
        <div class="header-inner">
            <div class="header-left">
                <a href="../index.html" class="logo">gameShelf</a>
                <span class="game-title">Whack-a-Mole</span>
            </div>
            <a href="../index.html" class="back-link">← Back to All Games</a>
        </div>
    </header>

    <div class="game-area">
        <div class="hud-bar">
            <span class="hud-item" id="scoreDisplay">Score: 0</span>
            <span class="hud-item" id="timeDisplay">Time: 30s</span>
            <span class="hud-item" id="highScoreDisplay">Best: 0</span>
        </div>

        <div class="canvas-wrapper">
            <canvas id="gameCanvas" width="400" height="400"></canvas>

            <div class="overlay" id="startOverlay">
                <div class="overlay-title">🔨 Whack-a-Mole</div>
                <div class="overlay-subtitle">Click or tap the moles before they hide! Get the highest score in 30 seconds.</div>
                <button class="btn" id="startBtn">▶ Start Game</button>
            </div>

            <div class="overlay hidden" id="gameOverOverlay">
                <div class="overlay-title" id="gameOverTitle">Time's Up!</div>
                <div class="overlay-subtitle" id="gameOverSubtitle">Score: 0</div>
                <button class="btn" id="restartBtn">↻ Play Again</button>
            </div>
        </div>
    </div>

    <footer class="site-footer">
        <div class="footer-inner">
            <div class="footer-links">
                <a href="../index.html">Home</a>
                <a href="../index.html">All Games</a>
            </div>
            <p>© 2025 gameShelf — All games built in browser — no downloads required</p>
        </div>
    </footer>

    <script>
    (function() {
        'use strict';

        // ── Constants ──
        const CANVAS_SIZE = 400;
        const GRID_COLS = 3;
        const GRID_ROWS = 3;
        const CELL_SIZE = CANVAS_SIZE / GRID_COLS;
        const MOLE_RADIUS = 45;
        const GAME_DURATION = 30; // seconds
        const MOLE_SHOW_TIME = 800; // ms a mole stays up
        const MOLE_SPAWN_INTERVAL = 600; // ms between spawn attempts

        // ── DOM refs ──
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const startOverlay = document.getElementById('startOverlay');
        const gameOverOverlay = document.getElementById('gameOverOverlay');
        const gameOverTitle = document.getElementById('gameOverTitle');
        const gameOverSubtitle = document.getElementById('gameOverSubtitle');
        const startBtn = document.getElementById('startBtn');
        const restartBtn = document.getElementById('restartBtn');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const timeDisplay = document.getElementById('timeDisplay');
        const highScoreDisplay = document.getElementById('highScoreDisplay');

        // ── Game State ──
        let board = [];        // 3x3 grid: null or mole object {row, col, timer, isUp}
        let score = 0;
        let timeLeft = GAME_DURATION;
        let gameState = 'start'; // 'start', 'playing', 'gameover'
        let gameTimer = null;
        let spawnTimer = null;
        let highScore = parseInt(localStorage.getItem('whackamole_highscore')) || 0;

        // ── Board Initialization ──
        function initBoard() {
            board = [];
            for (var r = 0; r < GRID_ROWS; r++) {
                board[r] = [];
                for (var c = 0; c < GRID_COLS; c++) {
                    board[r][c] = null;
                }
            }
            score = 0;
            timeLeft = GAME_DURATION;
            highScoreDisplay.textContent = 'Best: ' + highScore;
            updateHUD();
        }

        function updateHUD() {
            scoreDisplay.textContent = 'Score: ' + score;
            timeDisplay.textContent = 'Time: ' + timeLeft + 's';
        }

        // ── Mole Logic ──
        function spawnMole() {
            if (gameState !== 'playing') return;

            // Find empty cells
            var emptyCells = [];
            for (var r = 0; r < GRID_ROWS; r++) {
                for (var c = 0; c < GRID_COLS; c++) {
                    if (!board[r][c] || !board[r][c].isUp) {
                        emptyCells.push({ r: r, c: c });
                    }
                }
            }

            if (emptyCells.length === 0) return;

            var cell = emptyCells[Math.floor(Math.random() * emptyCells.length)];
            var mole = {
                row: cell.r,
                col: cell.c,
                isUp: true,
                timer: null
            };

            board[cell.r][cell.c] = mole;

            // Hide mole after show time
            mole.timer = setTimeout(function() {
                if (board[cell.r][cell.c] === mole) {
                    mole.isUp = false;
                    board[cell.r][cell.c] = null;
                    render();
                }
            }, MOLE_SHOW_TIME);

            render();
        }

        function whackMole(row, col) {
            if (gameState !== 'playing') return;
            if (!board[row][col] || !board[row][col].isUp) return;

            var mole = board[row][col];
            clearTimeout(mole.timer);
            mole.isUp = false;
            board[row][col] = null;

            score++;
            updateHUD();
            render();
        }

        // ── Rendering ──
        function render() {
            ctx.clearRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);

            // Draw background
            ctx.fillStyle = '#2d5a1e';
            ctx.fillRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);

            // Draw grid
            ctx.strokeStyle = '#1a4a10';
            ctx.lineWidth = 3;
            ctx.lineCap = 'round';

            for (var r = 0; r < GRID_ROWS; r++) {
                for (var c = 0; c < GRID_COLS; c++) {
                    var cx = c * CELL_SIZE + CELL_SIZE / 2;
                    var cy = r * CELL_SIZE + CELL_SIZE / 2;

                    // Draw hole
                    ctx.beginPath();
                    ctx.ellipse(cx, cy + 10, 50, 20, 0, 0, Math.PI * 2);
                    ctx.fillStyle = '#1a1a3e';
                    ctx.fill();

                    // Draw mole if up
                    if (board[r][c] && board[r][c].isUp) {
                        var mole = board[r][c];
                        // Mole body
                        ctx.beginPath();
                        ctx.arc(cx, cy, MOLE_RADIUS, 0, Math.PI * 2);
                        ctx.fillStyle = '#8B4513';
                        ctx.fill();
                        ctx.strokeStyle = '#654321';
                        ctx.lineWidth = 3;
                        ctx.stroke();

                        // Mole eyes
                        ctx.beginPath();
                        ctx.arc(cx - 12, cy - 10, 6, 0, Math.PI * 2);
                        ctx.fillStyle = '#fff';
                        ctx.fill();
                        ctx.beginPath();
                        ctx.arc(cx + 12, cy - 10, 6, 0, Math.PI * 2);
                        ctx.fillStyle = '#fff';
                        ctx.fill();

                        // Pupils
                        ctx.beginPath();
                        ctx.arc(cx - 12, cy - 10, 3, 0, Math.PI * 2);
                        ctx.fillStyle = '#000';
                        ctx.fill();
                        ctx.beginPath();
                        ctx.arc(cx + 12, cy - 10, 3, 0, Math.PI * 2);
                        ctx.fillStyle = '#000';
                        ctx.fill();

                        // Mole nose
                        ctx.beginPath();
                        ctx.ellipse(cx, cy + 5, 8, 5, 0, 0, Math.PI * 2);
                        ctx.fillStyle = '#ff6b6b';
                        ctx.fill();

                        // Mole teeth
                        ctx.fillStyle = '#fff';
                        ctx.fillRect(cx - 5, cy + 15, 4, 6);
                        ctx.fillRect(cx + 1, cy + 15, 4, 6);
                    }
                }
            }
        }

        // ── Game Flow ──
        function startGame() {
            initBoard();
            gameState = 'playing';
            startOverlay.classList.add('hidden');
            gameOverOverlay.classList.add('hidden');

            // Spawn first mole immediately
            spawnMole();

            // Start game timer
            gameTimer = setInterval(function() {
                timeLeft--;
                updateHUD();
                if (timeLeft <= 0) {
                    endGame();
                }
            }, 1000);

            // Start spawning moles
            spawnTimer = setInterval(function() {
                spawnMole();
            }, MOLE_SPAWN_INTERVAL);

            render();
        }

        function endGame() {
            gameState = 'gameover';
            clearInterval(gameTimer);
            clearInterval(spawnTimer);

            // Update high score
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('whackamole_highscore', highScore);
                highScoreDisplay.textContent = 'Best: ' + highScore;
            }

            // Show game over overlay
            gameOverTitle.textContent = score >= 15 ? 'Amazing!' : score >= 8 ? 'Great Job!' : "Time's Up!";
            gameOverSubtitle.textContent = 'You whacked ' + score + ' moles! Best: ' + highScore;
            gameOverOverlay.classList.remove('hidden');
        }

        function restart() {
            gameOverOverlay.classList.add('hidden');
            gameOverTitle.textContent = "Time's Up!";
            startOverlay.classList.remove('hidden');
            initBoard();
            gameState = 'start';
            render();
        }

        // ── Mouse Click Handler ──
        canvas.addEventListener('click', function(e) {
            e.preventDefault();
            if (gameState !== 'playing') return;

            var rect = canvas.getBoundingClientRect();
            var clickX = e.clientX - rect.left;
            var clickY = e.clientY - rect.top;

            // Convert to grid coordinates
            var col = Math.floor(clickX / CELL_SIZE);
            var row = Math.floor(clickY / CELL_SIZE);

            // Clamp to grid bounds
            col = Math.max(0, Math.min(GRID_COLS - 1, col));
            row = Math.max(0, Math.min(GRID_ROWS - 1, row));

            whackMole(row, col);
        });

        // ── Button Handlers ──
        startBtn.addEventListener('click', function() {
            startGame();
        });

        restartBtn.addEventListener('click', function() {
            restart();
        });

        // ── Keyboard support for overlays ──
        document.addEventListener('keydown', function(e) {
            if (gameState === 'start' && (e.key === 'Enter' || e.key === ' ')) {
                e.preventDefault();
                startGame();
                return;
            }
            if (gameState === 'gameover' && (e.key === 'Enter' || e.key === ' ')) {
                e.preventDefault();
                restart();
                return;
            }
        });

        // ── Initial Setup ──
        initBoard();
        render();

    })();
    </script>
</body>
</html>
