<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>gameShelf — Pac-Man</title>
    <style>
        /* CSS Custom Properties — match site theme */
        :root {
            --bg-primary: #0f0f23;
            --bg-secondary: #1a1a3e;
            --bg-card: #1e1e45;
            --text-primary: #e0e0e0;
            --text-secondary: #a0a0b8;
            --text-muted: #6b6b80;
            --accent: #00d4ff;
            --accent-hover: #00b8d9;
            --accent-glow: rgba(0, 212, 255, 0.3);
            --border-color: #2a2a5a;
            --header-bg: rgba(15, 15, 35, 0.95);
            --footer-bg: #0a0a1a;
        }

        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        .game-header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: var(--header-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            padding: 0.75rem 1.5rem;
        }

        .header-inner {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: var(--accent);
            text-shadow: 0 0 10px var(--accent-glow);
            white-space: nowrap;
            transition: text-shadow 0.2s ease;
        }

        .logo:hover {
            text-shadow: 0 0 20px var(--accent-glow), 0 0 40px rgba(0, 212, 255, 0.1);
        }

        .logo::before {
            content: '🎮';
            margin-right: 0.35rem;
        }

        .game-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .back-link {
            color: var(--accent);
            font-size: 0.9rem;
            font-weight: 500;
            transition: color 0.2s ease;
            white-space: nowrap;
        }

        .back-link:hover {
            color: var(--accent-hover);
            text-shadow: 0 0 10px var(--accent-glow);
        }

        /* Game Area */
        .game-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem 1.5rem;
        }

        /* Score / HUD Bar */
        .score-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 2rem;
            margin-bottom: 1.5rem;
            width: 560px;
            padding: 0.5rem 1rem;
            background: var(--bg-secondary);
            border: 2px solid var(--border-color);
            border-radius: 0.5rem;
        }

        .score-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            min-width: 80px;
        }

        .score-label {
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
        }

        .score-value {
            font-size: 1.8rem;
            font-weight: 800;
            font-family: 'Courier New', Courier, monospace;
            color: #facc15;
            text-shadow: 0 0 10px rgba(250, 204, 21, 0.4);
            min-width: 60px;
            text-align: center;
        }

        .high-score-value {
            color: var(--accent);
            text-shadow: 0 0 10px var(--accent-glow);
        }

        #lives {
            display: flex;
            gap: 6px;
            align-items: center;
            padding: 0.25rem 0.5rem;
        }

        /* Canvas */
        .canvas-wrapper {
            position: relative;
            border: 2px solid var(--border-color);
            border-radius: 0.75rem;
            box-shadow: 0 0 30px rgba(250, 204, 21, 0.08), 0 8px 24px rgba(0, 0, 0, 0.5);
            overflow: hidden;
        }

        canvas {
            display: block;
            background-color: var(--bg-primary);
        }

        /* Instructions */
        #inst {
            margin-top: 1rem;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        /* Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            background: var(--accent);
            color: var(--bg-primary);
            font-size: 1rem;
            font-weight: 700;
            padding: 0.5rem 2rem;
            border-radius: 0.75rem;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.15);
            margin-top: 0.5rem;
        }

        .btn:hover {
            background: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        /* Footer */
        .site-footer {
            margin-top: auto;
            background: var(--footer-bg);
            border-top: 1px solid var(--border-color);
            padding: 2rem 1.5rem;
        }

        .footer-inner {
            max-width: 1200px;
            margin: 0 auto;
            text-align: center;
        }

        .footer-links {
            display: flex;
            justify-content: center;
            gap: 3rem;
            margin-bottom: 0.5rem;
        }

        .footer-links a {
            color: var(--text-muted);
            font-size: 0.85rem;
            transition: color 0.2s ease;
        }

        .footer-links a:hover {
            color: var(--accent);
        }

        .site-footer p {
            color: var(--text-muted);
            font-size: 0.8rem;
        }

        /* Responsive */
        @media (max-width: 600px) {
            .header-inner {
                justify-content: center;
                text-align: center;
            }
            .score-bar {
                width: 95vw;
                gap: 0.5rem;
                font-size: 0.85rem;
            }
            .score-value {
                font-size: 1.4rem;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="game-header">
        <div class="header-inner">
            <div class="header-left">
                <a href="../index.html" class="logo">gameShelf</a>
                <span class="game-title">Pac-Man</span>
            </div>
            <a href="../index.html" class="back-link">← Back to All Games</a>
        </div>
    </header>

    <!-- Game Area -->
    <div class="game-area">
        <!-- Score Display -->
        <div class="score-bar">
            <div class="score-item">
                <span class="score-label">Score</span>
                <span class="score-value" id="sc">0</span>
            </div>
            <div class="score-item">
                <span class="score-label">High</span>
                <span class="score-value high-score-value" id="hs">0</span>
            </div>
            <div id="lives"></div>
        </div>

        <!-- Canvas -->
        <div class="canvas-wrapper">
            <canvas id="gc" width="560" height="620"></canvas>
        </div>

        <div id="inst">Use arrow keys to move — ESC to pause</div>
        <button id="playBtn" onclick="window.__restart()" class="btn" style="display:none;">Play Again</button>
    </div>

    <!-- Footer -->
    <footer class="site-footer">
        <div class="footer-inner">
            <div class="footer-links">
                <a href="../index.html">Home</a>
                <a href="../index.html">All Games</a>
            </div>
            <p>© 2025 gameShelf — All games built in browser — no downloads required</p>
        </div>
    </footer>

    <script>
(function(){
"use strict";

const C = document.getElementById('gc');
const X = C.getContext('2d');
const scE = document.getElementById('sc');
const hsE = document.getElementById('hs');
const lvE = document.getElementById('lives');
const playBtn = document.getElementById('playBtn');

const COLS = 28, ROWS = 31, TILE = 20;
const WALL = 1, DOT = 0, PEL = 2, EMPTY = 3, GHOUSE = 4, DOOR = 5;

// Directions
const UP = {x:0,y:-1}, DOWN = {x:0,y:1}, LEFT = {x:-1,y:0}, RIGHT = {x:1,y:0};

// ── Classic Pac-Man inspired 28×31 maze ──
// Row 0: top wall
// Row 1-8: main maze with dots
// Row 9-17: ghost house area
// Row 18-22: main maze
// Row 23-30: bottom area with Pac-Man start
const MAZE_TEMPLATE = [
  // 0: top wall
  "1111111111111111111111111111",
  // 1: dots
  "1000000000000011000000000001",
  // 2: maze with dots
  "1011110111110110111110111101",
  // 3: power pellets at col 3 and 24
  "1211110111110110111110111121",
  // 4: maze with dots
  "1011110111110110111110111101",
  // 5: tunnel row
  "1000000000000000000000000001",
  // 6: maze
  "1011110110111111110110111101",
  // 7: maze
  "1011110110111111110110111101",
  // 8: dots
  "1000000000000011000000000001",
  // 9: ghost house top
  "1111110111115115111110111111",
  // 10: ghost house
  "1111110111111111111110111111",
  // 11: ghost house entrance
  "1111110110000000000110111111",
  // 12: ghost house interior
  "1111110110111441110110111111",
  // 13: ghost house interior
  "1111110000144444410000111111",
  // 14: ghost house interior
  "1111110110144444410110111111",
  // 15: ghost house interior
  "1111110110144444410110111111",
  // 16: ghost house interior
  "1111110110111111110110111111",
  // 17: ghost house exit
  "1111110110000000000110111111",
  // 18: below ghost house
  "1111110111111111111110111111",
  // 19: dots
  "1000000000000011000000000001",
  // 20: maze
  "1011110111110110111110111101",
  // 21: maze
  "1011110111110110111110111101",
  // 22: power pellets at col 3 and 24
  "1200000000000011000000000021",
  // 23: Pac-Man start area
  "1111110111110110111110111111",
  // 24: dots below
  "1000000000000000000000000001",
  // 25: dots with walls
  "1011111111110110111111111101",
  // 26: dots with walls
  "1011111111110110111111111101",
  // 27: dots
  "1000000000000000000000000001",
  // 28: bottom wall
  "1111111111111111111111111111",
  // 29: bottom wall (padding)
  "1111111111111111111111111111",
  // 30: bottom wall (padding)
  "1111111111111111111111111111",
];

let maze, score, lives, highScore, gameState, gamePhase;
let pac, ghosts, dotCount, totalDots;
let frightTimer, frightDuration, ghostCombo;
let lastTs = 0, deathTimer;
let animFrame;
let readyTimer = 0;

const PAC_SPEED = 220;
const GHOST_SPEED = 165;
const FRIGHT_SPEED = 100;
const EATEN_SPEED = 350;

function cloneMaze(m) { return m.map(r => r.slice()); }

function countDots() {
  let c = 0;
  for (let r = 0; r < ROWS; r++)
    for (let col = 0; col < COLS; col++)
      if (maze[r][col] === DOT || maze[r][col] === PEL) c++;
  return c;
}

function loadHigh() {
  highScore = parseInt(localStorage.getItem('pacmanHS')) || 0;
  hsE.textContent = highScore;
}

function saveHigh() {
  if (score > highScore) {
    highScore = score;
    localStorage.setItem('pacmanHS', highScore);
  }
  hsE.textContent = highScore;
}

function dist(a, b) {
  return Math.abs(a[0] - b[0]) + Math.abs(a[1] - b[1]);
}

function initMaze() {
  maze = [];
  for (let r = 0; r < ROWS; r++) {
    const line = MAZE_TEMPLATE[r];
    const row = [];
    for (let col = 0; col < COLS; col++) {
      const v = parseInt(line[col]);
      row.push(v);
    }
    maze.push(row);
  }
  totalDots = countDots();
  dotCount = 0;
}

function initPac() {
  pac = {
    gx: 14, gy: 24,
    x: 14 * TILE + TILE / 2, y: 24 * TILE + TILE / 2,
    dx: 0, dy: 0,
    ndx: 0, ndy: 0,
    moving: false,
    mouthAngle: 0,
  };
}

function initGhosts() {
  ghosts = [
    { id: 0, color: '#ff0000', gx: 13, gy: 11, x: 13 * TILE + TILE / 2, y: 11 * TILE + TILE / 2, dx: 0, dy: 0, st: 'house', releaseTime: 0 },
    { id: 1, color: '#ffb8ff', gx: 14, gy: 11, x: 14 * TILE + TILE / 2, y: 11 * TILE + TILE / 2, dx: 0, dy: 0, st: 'house', releaseTime: 5000 },
    { id: 2, color: '#00ffff', gx: 12, gy: 13, x: 12 * TILE + TILE / 2, y: 13 * TILE + TILE / 2, dx: 0, dy: 0, st: 'house', releaseTime: 10000 },
    { id: 3, color: '#ffb852', gx: 15, gy: 13, x: 15 * TILE + TILE / 2, y: 13 * TILE + TILE / 2, dx: 0, dy: 0, st: 'house', releaseTime: 15000 },
  ];
}

function resetRound(keep) {
  if (!keep) {
    score = 0;
    lives = 3;
    frightTimer = 0;
    ghostCombo = 0;
  }
  initMaze();
  initPac();
  initGhosts();
  ghostCombo = 0;
  gameState = 'playing';
  gamePhase = 'ready';
  deathTimer = 0;
  readyTimer = 1500;
  updateHUD();
}

function updateHUD() {
  scE.textContent = score;
  saveHigh();
  lvE.innerHTML = '';
  for (let i = 0; i < lives; i++) {
    const s = document.createElement('canvas');
    s.width = 18; s.height = 18;
    const c2 = s.getContext('2d');
    c2.fillStyle = '#facc15';
    c2.beginPath();
    c2.arc(9, 9, 8, 0.3 * Math.PI, 1.7 * Math.PI);
    c2.lineTo(9, 9);
    c2.fill();
    lvE.appendChild(s);
  }
}

function isWall(col, row) {
  if (row < 0 || row >= ROWS) return true;
  if (col < 0 || col >= COLS) return true;
  return maze[row][col] === WALL;
}

function isInGhostHouse(col, row) {
  return row >= 12 && row <= 16 && col >= 10 && col <= 17;
}

function isPassable(col, row, forGhost) {
  if (row < 0 || row >= ROWS) return false;
  if (col < 0 || col >= COLS) return false;
  const v = maze[row][col];
  if (v === WALL) return false;
  if (v === DOOR) {
    return forGhost;
  }
  return true;
}

function getValidDirs(gx, gy, curDx, curDy, forGhost) {
  const dirs = [UP, DOWN, LEFT, RIGHT];
  const results = [];
  for (const d of dirs) {
    // Don't allow 180° turns unless dead end
    if (forGhost && d.x === -curDx && d.y === -curDy) continue;
    const nc = gx + d.x;
    const nr = gy + d.y;
    if (isPassable(nc, nr, forGhost)) results.push(d);
  }
  if (results.length === 0 && forGhost) {
    // Dead end: allow reverse
    const rev = { x: -curDx, y: -curDy };
    const nc = gx + rev.x;
    const nr = gy + rev.y;
    if (isPassable(nc, nr, forGhost)) results.push(rev);
  }
  return results;
}

// ── Ghost targeting ──
function getGhostTarget(gh) {
  if (gh.st === 'eaten') return { x: 13, y: 11 };
  if (gh.st === 'frightened') return null; // handled separately

  const px = pac.gx, py = pac.gy;

  switch (gh.id) {
    case 0: // Blinky: chaser - targets Pac-Man directly
      return { x: px, y: py };
    case 1: { // Pinky: ambusher - targets 4 tiles ahead of Pac-Man
      const tx = px + pac.dx * 4;
      const ty = py + pac.dy * 4;
      return { x: tx, y: ty };
    }
    case 2: { // Inky: tactician - two vector approach
      const ax = px + pac.dx * 2;
      const ay = py + pac.dy * 2;
      const bx = ghosts[0].gx;
      const by = ghosts[0].gy;
      return { x: ax + (ax - bx), y: ay + (ay - by) };
    }
    case 3: { // Clyde: random/drifter
      if (dist([gh.gx, gh.gy], [px, py]) > 8) {
        return { x: px, y: py };
      }
      return { x: 0, y: ROWS - 1 };
    }
  }
  return { x: px, y: py };
}

function activateFrightened() {
  frightTimer = frightDuration;
  ghostCombo = 0;
  for (const g of ghosts) {
    if (g.st === 'normal') {
      g.st = 'frightened';
      // Reverse direction
      g.dx = -g.dx;
      g.dy = -g.dy;
      if (g.dx === 0 && g.dy === 0) { g.dx = -1; g.dy = 0; }
    }
  }
}

function eatGhost(gh) {
  gh.st = 'eaten';
  ghostCombo++;
  score += 200 * Math.pow(2, ghostCombo - 1);
  updateHUD();
}

// ── Update ──
function updatePac(dt) {
  if (!pac.moving) return;

  const moved = PAC_SPEED * dt;
  pac.x += pac.dx * moved;
  pac.y += pac.dy * moved;

  // Tunnel wrap
  if (pac.x < 0) pac.x = (COLS - 1) * TILE + TILE / 2;
  if (pac.x >= COLS * TILE) pac.x = TILE / 2;

  pac.gx = Math.round(pac.x / TILE);
  pac.gy = Math.round(pac.y / TILE);

  const cx = pac.gx * TILE + TILE / 2;
  const cy = pac.gy * TILE + TILE / 2;

  // Check if aligned with tile center
  const aligned = Math.abs(pac.x - cx) < 1.5 && Math.abs(pac.y - cy) < 1.5;

  if (aligned || !isPassable(pac.gx + pac.dx, pac.gy + pac.dy, false)) {
    // Snap to tile center
    pac.x = cx;
    pac.y = cy;
    pac.gx = Math.round(pac.x / TILE);
    pac.gy = Math.round(pac.y / TILE);

    if (pac.gx < 0) pac.gx = 0;
    if (pac.gx >= COLS) pac.gx = COLS - 1;
    if (pac.gy < 0) pac.gy = 0;
    if (pac.gy >= ROWS) pac.gy = ROWS - 1;

    // Eat dot or pellet
    if (pac.gy >= 0 && pac.gy < ROWS && pac.gx >= 0 && pac.gx < COLS) {
      const cell = maze[pac.gy][pac.gx];
      if (cell === DOT) {
        maze[pac.gy][pac.gx] = EMPTY;
        score += 10;
        dotCount++;
      } else if (cell === PEL) {
        maze[pac.gy][pac.gx] = EMPTY;
        score += 50;
        dotCount++;
        activateFrightened();
      }
    }

    // Try buffered direction at tile center
    if ((pac.ndx !== 0 || pac.ndy !== 0)) {
      if (isPassable(pac.gx + pac.ndx, pac.gy + pac.ndy, false)) {
        pac.dx = pac.ndx;
        pac.dy = pac.ndy;
        pac.ndx = 0;
        pac.ndy = 0;
      }
    }

    // Check if we can keep moving
    if (!isPassable(pac.gx + pac.dx, pac.gy + pac.dy, false)) {
      pac.moving = false;
    }
  }

  pac.mouthAngle += dt * 10;

  if (dotCount >= totalDots) gameState = 'win';
}

function releaseGhost(gh) {
  gh.st = 'normal';
  gh.gx = 13;
  gh.gy = 11;
  gh.x = 13 * TILE + TILE / 2;
  gh.y = 11 * TILE + TILE / 2;
  gh.dx = -1;
  gh.dy = 0;
}

function updateGhost(gh, dt) {
  if (gh.st === 'house') {
    gh.releaseTime -= dt * 1000;
    if (gh.releaseTime <= 0) releaseGhost(gh);
    return;
  }

  if (gh.st === 'eaten') {
    const targetX = 13 * TILE + TILE / 2;
    const targetY = 11 * TILE + TILE / 2;
    const dx2 = targetX - gh.x;
    const dy2 = targetY - gh.y;
    const d = Math.sqrt(dx2 * dx2 + dy2 * dy2);
    if (d < 3) {
      gh.x = targetX;
      gh.y = targetY;
      gh.gx = 13;
      gh.gy = 11;
      gh.st = 'house';
      gh.releaseTime = 2000;
      return;
    }
    const moved = EATEN_SPEED * dt;
    gh.x += (dx2 / d) * moved;
    gh.y += (dy2 / d) * moved;
    gh.gx = Math.round(gh.x / TILE);
    gh.gy = Math.round(gh.y / TILE);
    if (gh.x < 0) gh.x = (COLS - 1) * TILE + TILE / 2;
    if (gh.x >= COLS * TILE) gh.x = TILE / 2;
    return;
  }

  const speed = gh.st === 'frightened' ? FRIGHT_SPEED : GHOST_SPEED;
  const moved = speed * dt;
  gh.x += gh.dx * moved;
  gh.y += gh.dy * moved;

  // Tunnel wrap
  if (gh.x < 0) gh.x = (COLS - 1) * TILE + TILE / 2;
  if (gh.x >= COLS * TILE) gh.x = TILE / 2;

  gh.gx = Math.round(gh.x / TILE);
  gh.gy = Math.round(gh.y / TILE);

  const tcx = gh.gx * TILE + TILE / 2;
  const tcy = gh.gy * TILE + TILE / 2;

  // Check if aligned with tile center
  if (Math.abs(gh.x - tcx) < 1.5 && Math.abs(gh.y - tcy) < 1.5) {
    gh.x = tcx;
    gh.y = tcy;
    gh.gx = Math.round(gh.x / TILE);
    gh.gy = Math.round(gh.y / TILE);

    const dirs = getValidDirs(gh.gx, gh.gy, gh.dx, gh.dy, true);
    if (dirs.length === 0) return;

    if (gh.st === 'frightened') {
      // Pick direction that maximizes distance from Pac-Man
      let best = dirs[0], bestD = -1;
      for (const d of dirs) {
        const dd = dist([gh.gx + d.x, gh.gy + d.y], [pac.gx, pac.gy]);
        if (dd > bestD) { bestD = dd; best = d; }
      }
      gh.dx = best.x;
      gh.dy = best.y;
    } else {
      const tgt = getGhostTarget(gh);
      if (tgt) {
        let best = dirs[0], bestD = Infinity;
        for (const d of dirs) {
          const dd = dist([gh.gx + d.x, gh.gy + d.y], [tgt.x, tgt.y]);
          if (dd < bestD) { bestD = dd; best = d; }
        }
        gh.dx = best.x;
        gh.dy = best.y;
      }
    }
  }
}

function checkCollisions() {
  for (const g of ghosts) {
    if (g.st === 'house') continue;
    const dx = pac.x - g.x;
    const dy = pac.y - g.y;
    if (Math.sqrt(dx * dx + dy * dy) < TILE * 0.75) {
      if (g.st === 'frightened') {
        eatGhost(g);
      } else if (g.st === 'normal') {
        lives--;
        updateHUD();
        if (lives <= 0) {
          gameState = 'gameover';
          saveHigh();
          playBtn.style.display = 'inline-flex';
        } else {
          pac.moving = false;
          deathTimer = 1500;
          gameState = 'dying';
        }
        return;
      }
    }
  }
}

function resetPositions() {
  initPac();
  initGhosts();
  frightTimer = 0;
  ghostCombo = 0;
  gameState = 'playing';
  gamePhase = 'ready';
  deathTimer = 0;
  readyTimer = 1500;
}

// ── Render ──
function drawMaze() {
  for (let r = 0; r < ROWS; r++) {
    for (let col = 0; col < COLS; col++) {
      const v = maze[r][col];
      const x = col * TILE;
      const y = r * TILE;
      if (v === WALL) {
        X.fillStyle = '#1a1a5e';
        X.fillRect(x, y, TILE, TILE);
        // Draw subtle inner border for depth
        X.strokeStyle = '#2525a0';
        X.lineWidth = 0.5;
        X.strokeRect(x + 0.5, y + 0.5, TILE - 1, TILE - 1);
      } else if (v === DOOR) {
        X.fillStyle = '#ffb8ff';
        X.fillRect(x, y + TILE / 2 - 2, TILE, 4);
      } else if (v === DOT) {
        X.fillStyle = '#ffb8ae';
        X.beginPath();
        X.arc(x + TILE / 2, y + TILE / 2, 2.5, 0, Math.PI * 2);
        X.fill();
      } else if (v === PEL) {
        const sz = 6 + 3 * Math.max(0, Math.sin(Date.now() / 200));
        X.fillStyle = '#facc15';
        X.shadowColor = '#facc15';
        X.shadowBlur = 6;
        X.beginPath();
        X.arc(x + TILE / 2, y + TILE / 2, sz / 2, 0, Math.PI * 2);
        X.fill();
        X.shadowBlur = 0;
      }
    }
  }
}

function drawPac() {
  let angle = 0;
  if (pac.dx === 1) angle = 0;
  else if (pac.dx === -1) angle = Math.PI;
  else if (pac.dy === -1) angle = -Math.PI / 2;
  else if (pac.dy === 1) angle = Math.PI / 2;

  const mouth = 0.12 + 0.38 * Math.max(0, Math.sin(pac.mouthAngle));

  X.fillStyle = '#facc15';
  X.beginPath();
  X.arc(pac.x, pac.y, TILE / 2 - 1, angle + mouth, angle + Math.PI * 2 - mouth);
  X.lineTo(pac.x, pac.y);
  X.closePath();
  X.fill();

  // Eye
  const ea = angle - Math.PI / 4;
  X.fillStyle = '#0f0f23';
  X.beginPath();
  X.arc(pac.x + Math.cos(ea) * 5, pac.y + Math.sin(ea) * 5, 1.8, 0, Math.PI * 2);
  X.fill();
}

function drawGhost(gh) {
  const col = gh.st === 'frightened' ? '#2121de' : gh.color;
  const cx = gh.x;
  const cy = gh.y;
  const r = TILE / 2 - 1;

  X.fillStyle = col;
  X.beginPath();
  // Dome
  X.arc(cx, cy - 2, r, Math.PI, 0, false);
  // Bottom with wavy feet
  X.lineTo(cx + r, cy + r - 2);
  const segW = (2 * r) / 3;
  const t = Date.now() / 150;
  for (let i = 0; i < 3; i++) {
    const bx = cx + r - (i + 1) * segW;
    const ex = cx + r - i * segW;
    const wave = (i % 2 === 0) ? 3.5 : -2.5;
    X.quadraticCurveTo((bx + ex) / 2, cy + r - 2 + wave + Math.sin(t + i) * 1.5, ex, cy + r - 2);
  }
  X.closePath();
  X.fill();

  if (gh.st === 'frightened') {
    // Frightened face
    const flash = frightTimer < 2000 && Math.sin(Date.now() / 100) > 0;
    if (!flash) {
      X.fillStyle = '#fff';
      X.beginPath(); X.arc(cx - 4, cy - 4, 2.5, 0, Math.PI * 2); X.fill();
      X.beginPath(); X.arc(cx + 4, cy - 4, 2.5, 0, Math.PI * 2); X.fill();
      // Mouth
      X.strokeStyle = '#fff';
      X.lineWidth = 1;
      X.beginPath();
      X.moveTo(cx - 5, cy + 3);
      for (let i = 0; i < 5; i++) {
        X.lineTo(cx - 5 + i * 2.5, cy + 3 + (i % 2 === 0 ? 0 : -2));
      }
      X.stroke();
    } else {
      X.fillStyle = '#f00';
      X.beginPath(); X.arc(cx - 4, cy - 4, 3, 0, Math.PI * 2); X.fill();
      X.beginPath(); X.arc(cx + 4, cy - 4, 3, 0, Math.PI * 2); X.fill();
    }
  } else {
    // Normal eyes
    X.fillStyle = '#fff';
    X.beginPath(); X.arc(cx - 4, cy - 4, 4.5, 0, Math.PI * 2); X.fill();
    X.beginPath(); X.arc(cx + 4, cy - 4, 4.5, 0, Math.PI * 2); X.fill();
    // Pupils
    X.fillStyle = '#111';
    X.beginPath(); X.arc(cx - 4 + gh.dx * 2.5, cy - 4 + gh.dy * 2.5, 2.2, 0, Math.PI * 2); X.fill();
    X.beginPath(); X.arc(cx + 4 + gh.dx * 2.5, cy - 4 + gh.dy * 2.5, 2.2, 0, Math.PI * 2); X.fill();
  }
}

function drawEyesOnly(gh) {
  X.fillStyle = '#fff';
  X.beginPath(); X.arc(gh.x - 4, gh.y - 3, 4.5, 0, Math.PI * 2); X.fill();
  X.beginPath(); X.arc(gh.x + 4, gh.y - 3, 4.5, 0, Math.PI * 2); X.fill();
  X.fillStyle = '#111';
  const tx = 13 * TILE + TILE / 2;
  const ty = 11 * TILE + TILE / 2;
  const adx = (tx - gh.x) > 0 ? 2 : -2;
  const ady = (ty - gh.y) > 0 ? 2 : -2;
  X.beginPath(); X.arc(gh.x - 4 + adx, gh.y - 3 + ady, 2.2, 0, Math.PI * 2); X.fill();
  X.beginPath(); X.arc(gh.x + 4 + adx, gh.y - 3 + ady, 2.2, 0, Math.PI * 2); X.fill();
}

function drawReady() {
  if (Math.sin(Date.now() / 200) > -0.3) {
    X.fillStyle = '#facc15';
    X.font = 'bold 22px sans-serif';
    X.textAlign = 'center';
    X.fillText('READY!', C.width / 2, 22 * TILE);
  }
}

function drawPauseOverlay() {
  X.fillStyle = 'rgba(0,0,0,0.65)';
  X.fillRect(0, 0, C.width, C.height);
  X.fillStyle = '#facc15';
  X.font = 'bold 36px sans-serif';
  X.textAlign = 'center';
  X.fillText('PAUSED', C.width / 2, C.height / 2 - 10);
  X.fillStyle = '#888';
  X.font = '16px sans-serif';
  X.fillText('Press ESC to resume', C.width / 2, C.height / 2 + 25);
}

function drawGameOver() {
  X.fillStyle = 'rgba(0,0,0,0.8)';
  X.fillRect(0, 0, C.width, C.height);
  X.fillStyle = '#facc15';
  X.font = 'bold 42px sans-serif';
  X.textAlign = 'center';
  X.fillText('GAME OVER', C.width / 2, C.height / 2 - 30);
  X.fillStyle = '#e0e0e0';
  X.font = '22px sans-serif';
  X.fillText('Score: ' + score, C.width / 2, C.height / 2 + 5);
  X.fillStyle = '#aaa';
  X.font = '16px sans-serif';
  X.fillText('Press any key or click Play Again', C.width / 2, C.height / 2 + 35);
}

function drawWin() {
  X.fillStyle = 'rgba(0,0,0,0.8)';
  X.fillRect(0, 0, C.width, C.height);
  X.fillStyle = '#facc15';
  X.font = 'bold 42px sans-serif';
  X.textAlign = 'center';
  X.fillText('YOU WIN!', C.width / 2, C.height / 2 - 30);
  X.fillStyle = '#e0e0e0';
  X.font = '22px sans-serif';
  X.fillText('Score: ' + score, C.width / 2, C.height / 2 + 5);
  X.fillStyle = '#aaa';
  X.font = '16px sans-serif';
  X.fillText('Press any key or click Play Again', C.width / 2, C.height / 2 + 35);
}

function render() {
  X.fillStyle = '#0f0f23';
  X.fillRect(0, 0, C.width, C.height);
  drawMaze();

  if (gameState === 'playing' || gameState === 'dying') {
    // Draw dying animation
    if (gameState === 'dying') {
      const flash = Math.sin(Date.now() / 100) > 0;
      if (flash) drawPac();
    } else {
      drawPac();
    }
    for (const g of ghosts) {
      if (g.st === 'house') continue;
      if (g.st === 'eaten') drawEyesOnly(g);
      else drawGhost(g);
    }
    if (gamePhase === 'ready') drawReady();
  } else if (gameState === 'paused') {
    drawPac();
    for (const g of ghosts) {
      if (g.st === 'house') continue;
      if (g.st === 'eaten') drawEyesOnly(g);
      else drawGhost(g);
    }
    drawPauseOverlay();
  } else if (gameState === 'gameover') {
    drawGameOver();
  } else if (gameState === 'win') {
    drawWin();
  }
}

// ── Game loop ──
function loop(ts) {
  if (!lastTs) lastTs = ts;
  const dt = Math.min((ts - lastTs) / 1000, 0.05);
  lastTs = ts;

  if (gameState === 'playing') {
    if (gamePhase === 'ready') {
      readyTimer -= dt * 1000;
      if (readyTimer <= 0) gamePhase = 'playing';
    } else {
      if (frightTimer > 0) {
        frightTimer -= dt * 1000;
        if (frightTimer <= 0) {
          frightTimer = 0;
          for (const g of ghosts) {
            if (g.st === 'frightened') g.st = 'normal';
          }
        }
      }
      if (gameState === 'playing') {
        updatePac(dt);
        for (const g of ghosts) updateGhost(g, dt);
        if (gameState === 'playing') checkCollisions();
      }
    }
  } else if (gameState === 'dying') {
    deathTimer -= dt * 1000;
    if (deathTimer <= 0) resetPositions();
  }

  render();
  animFrame = requestAnimationFrame(loop);
}

// ── Input ──
document.addEventListener('keydown', function(e) {
  const k = e.key;

  if (k === 'Escape') {
    e.preventDefault();
    if (gameState === 'playing' && gamePhase !== 'ready') {
      gameState = 'paused';
    } else if (gameState === 'paused') {
      gameState = 'playing';
    }
    return;
  }

  if (gameState === 'gameover' || gameState === 'win') {
    saveHigh();
    playBtn.style.display = 'none';
    resetRound(false);
    return;
  }

  switch (k) {
    case 'ArrowUp': case 'w': case 'W':
      e.preventDefault();
      pac.ndx = 0; pac.ndy = -1;
      if (!pac.moving) pac.moving = true;
      if (gameState === 'playing' && gamePhase === 'ready') gamePhase = 'playing';
      break;
    case 'ArrowDown': case 's': case 'S':
      e.preventDefault();
      pac.ndx = 0; pac.ndy = 1;
      if (!pac.moving) pac.moving = true;
      if (gameState === 'playing' && gamePhase === 'ready') gamePhase = 'playing';
      break;
    case 'ArrowLeft': case 'a': case 'A':
      e.preventDefault();
      pac.ndx = -1; pac.ndy = 0;
      if (!pac.moving) pac.moving = true;
      if (gameState === 'playing' && gamePhase === 'ready') gamePhase = 'playing';
      break;
    case 'ArrowRight': case 'd': case 'D':
      e.preventDefault();
      pac.ndx = 1; pac.ndy = 0;
      if (!pac.moving) pac.moving = true;
      if (gameState === 'playing' && gamePhase === 'ready') gamePhase = 'playing';
      break;
  }
});

C.addEventListener('click', function() {
  if (gameState === 'gameover' || gameState === 'win') {
    saveHigh();
    playBtn.style.display = 'none';
    resetRound(false);
  }
});

window.__restart = function() {
  saveHigh();
  playBtn.style.display = 'none';
  resetRound(false);
};

// ── Init ──
loadHigh();
frightDuration = 7000;
resetRound(false);
animFrame = requestAnimationFrame(loop);

})();
</script>
