<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>gameShelf — Space Invaders</title>
    <link rel="stylesheet" href="../styles.css">
    <style>
        /* CSS Custom Properties — match site theme */
        :root {
            --bg-primary: #0f0f23;
            --bg-secondary: #1a1a3e;
            --bg-card: #1e1e45;
            --text-primary: #e0e0e0;
            --text-secondary: #a0a0b8;
            --text-muted: #6b6b80;
            --accent: #22d3ee;
            --accent-hover: #06b6d4;
            --accent-glow: rgba(34, 211, 238, 0.3);
            --border-color: #2a2a5a;
            --header-bg: rgba(15, 15, 35, 0.95);
            --alien-color-1: #f472b6;
            --alien-color-2: #a78bfa;
            --alien-color-3: #4ade80;
            --player-color: #22d3ee;
            --bullet-player: #4ade80;
            --bullet-alien: #f87171;
        }

        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        .game-header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: var(--header-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            padding: var(--spacing-md) var(--spacing-lg);
        }

        .header-inner {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: var(--spacing-md);
            flex-wrap: wrap;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: var(--spacing-lg);
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: var(--accent);
            text-shadow: 0 0 10px var(--accent-glow);
            white-space: nowrap;
            transition: text-shadow var(--transition-normal);
        }

        .logo:hover {
            text-shadow: 0 0 20px var(--accent-glow), 0 0 40px rgba(34, 211, 238, 0.1);
        }

        .logo::before {
            content: '🎮';
            margin-right: 0.35rem;
        }

        .game-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .back-link {
            color: var(--accent);
            font-size: 0.9rem;
            font-weight: 500;
            transition: color 0.2s ease;
            white-space: nowrap;
        }

        .back-link:hover {
            color: var(--accent-hover);
            text-shadow: 0 0 10px var(--accent-glow);
        }

        /* Game Area */
        .game-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: var(--spacing-xl) var(--spacing-lg);
        }

        /* HUD Bar */
        .hud-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 400px;
            margin-bottom: var(--spacing-sm);
            padding: 0 var(--spacing-xs);
        }

        .hud-item {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .hud-item.score {
            color: var(--accent);
        }

        .hud-item.lives {
            color: var(--alien-color-3);
        }

        .hud-item.wave {
            color: var(--alien-color-2);
        }

        /* Canvas */
        .canvas-wrapper {
            position: relative;
            border: 2px solid var(--border-color);
            border-radius: var(--radius-md);
            box-shadow: 0 0 30px rgba(34, 211, 238, 0.1), var(--shadow-lg);
            overflow: hidden;
        }

        canvas {
            display: block;
            background-color: #0a0a1a;
        }

        /* Overlay (Start / Game Over) */
        .overlay {
            position: absolute;
            inset: 0;
            background: rgba(10, 10, 26, 0.92);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: var(--spacing-md);
            z-index: 10;
            border-radius: var(--radius-md);
            transition: opacity 0.3s ease;
        }

        .overlay.hidden {
            display: none;
        }

        .overlay-title {
            font-size: 2rem;
            font-weight: 800;
            color: var(--text-primary);
            text-shadow: 0 0 20px var(--accent-glow);
        }

        .overlay-subtitle {
            font-size: 1rem;
            color: var(--text-secondary);
            text-align: center;
            max-width: 280px;
            line-height: 1.5;
        }

        .overlay-score {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--accent);
            margin: var(--spacing-sm) 0;
        }

        .overlay-high-score {
            font-size: 0.95rem;
            color: var(--text-secondary);
        }

        .overlay-high-score span {
            color: var(--accent);
            font-weight: 700;
        }

        /* Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: var(--spacing-sm);
            background: var(--accent);
            color: var(--bg-primary);
            font-size: 1rem;
            font-weight: 700;
            padding: var(--spacing-sm) var(--spacing-xl);
            border-radius: var(--radius-md);
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: var(--shadow-accent);
            margin-top: var(--spacing-sm);
        }

        .btn:hover {
            background: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 0 30px rgba(34, 211, 238, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        /* Footer */
        .site-footer {
            margin-top: auto;
            background: var(--footer-bg);
            border-top: 1px solid var(--border-color);
            padding: var(--spacing-xl) var(--spacing-lg);
        }

        .footer-inner {
            max-width: 1200px;
            margin: 0 auto;
            text-align: center;
        }

        .footer-links {
            display: flex;
            justify-content: center;
            gap: var(--spacing-xl);
            margin-bottom: var(--spacing-md);
        }

        .footer-links a {
            color: var(--text-muted);
            font-size: 0.85rem;
            transition: color 0.2s ease;
        }

        .footer-links a:hover {
            color: var(--accent);
        }

        .site-footer p {
            color: var(--text-muted);
            font-size: 0.8rem;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .header-inner {
                justify-content: center;
                text-align: center;
            }
            .hud-bar {
                width: 320px;
                font-size: 0.85rem;
            }
            canvas {
                width: 320px;
                height: 320px;
            }
            .overlay-title {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="game-header">
        <div class="header-inner">
            <div class="header-left">
                <a href="../index.html" class="logo">gameShelf</a>
                <span class="game-title">Space Invaders</span>
            </div>
            <a href="../index.html" class="back-link">← Back to All Games</a>
        </div>
    </header>

    <!-- Game Area -->
    <div class="game-area">
        <!-- HUD Bar -->
        <div class="hud-bar" id="hudBar">
            <span class="hud-item score" id="scoreDisplay">Score: 0</span>
            <span class="hud-item wave" id="waveDisplay">Wave: 1</span>
            <span class="hud-item lives" id="livesDisplay">❤️❤️❤️</span>
        </div>

        <!-- Canvas -->
        <div class="canvas-wrapper">
            <canvas id="gameCanvas" width="400" height="400"></canvas>

            <!-- Start Overlay -->
            <div class="overlay" id="startOverlay">
                <div class="overlay-title">👾 Space Invaders</div>
                <div class="overlay-subtitle">Defend Earth from waves of descending alien invaders! Use arrow keys to move, space to shoot.</div>
                <button class="btn" id="startBtn">▶ Start Game</button>
            </div>

            <!-- Game Over Overlay -->
            <div class="overlay hidden" id="gameOverOverlay">
                <div class="overlay-title">Game Over</div>
                <div class="overlay-score" id="finalScore">Score: 0</div>
                <div class="overlay-high-score">High Score: <span id="finalHighScore">0</span></div>
                <button class="btn" id="restartBtn">↻ Play Again</button>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="site-footer">
        <div class="footer-inner">
            <div class="footer-links">
                <a href="../index.html">Home</a>
                <a href="../index.html">All Games</a>
            </div>
            <p>© 2025 gameShelf — All games built in browser — no downloads required</p>
        </div>
    </footer>

    <script>
    (function() {
        'use strict';

        // ── Constants ──
        var CANVAS_W = 400;
        var CANVAS_H = 400;
        var PLAYER_W = 32;
        var PLAYER_H = 20;
        var PLAYER_SPEED = 4;
        var BULLET_W = 3;
        var BULLET_H = 12;
        var BULLET_SPEED = 6;
        var ALIEN_W = 24;
        var ALIEN_H = 18;
        var ALIEN_COLS = 8;
        var ALIEN_ROWS = 4;
        var ALIEN_GAP_X = 10;
        var ALIEN_GAP_Y = 10;
        var ALIEN_TOP_PAD = 50;
        var PLAYER_ROW = CANVAS_H - 36;
        var BASE_ALIEN_SPEED = 0.6;
        var BASE_ALIEN_BULLET_RATE = 2000; // ms between shots (initial)
        var MIN_ALIEN_BULLET_RATE = 500;
        var ALIEN_BULLET_W = 3;
        var ALIEN_BULLET_H = 12;
        var ALIEN_BULLET_SPEED = 3;

        // ── DOM refs ──
        var canvas = document.getElementById('gameCanvas');
        var ctx = canvas.getContext('2d');
        var scoreDisplay = document.getElementById('scoreDisplay');
        var waveDisplay = document.getElementById('waveDisplay');
        var livesDisplay = document.getElementById('livesDisplay');
        var startOverlay = document.getElementById('startOverlay');
        var gameOverOverlay = document.getElementById('gameOverOverlay');
        var finalScoreEl = document.getElementById('finalScore');
        var finalHighScoreEl = document.getElementById('finalHighScore');
        var startBtn = document.getElementById('startBtn');
        var restartBtn = document.getElementById('restartBtn');

        // ── Game State ──
        var player = { x: 0, y: PLAYER_ROW };
        var playerBullet = null; // {x, y} or null
        var aliens = [];
        var alienBullets = [];
        var stars = [];
        var score = 0;
        var lives = 3;
        var wave = 1;
        var highScore = parseInt(localStorage.getItem('spaceInvadersHighScore'), 10) || 0;
        var gameState = 'start'; // 'start', 'playing', 'gameover'
        var animFrameId = null;
        var lastAlienShoot = 0;
        var keysDown = {};

        // ── High Score Display ──
        scoreDisplay.textContent = 'Score: 0';
        waveDisplay.textContent = 'Wave: 1';
        livesDisplay.textContent = '❤️❤️❤️';

        // ── Helpers ──
        function initStars() {
            stars = [];
            for (var i = 0; i < 80; i++) {
                stars.push({
                    x: Math.random() * CANVAS_W,
                    y: Math.random() * CANVAS_H,
                    size: Math.random() * 1.5 + 0.5,
                    alpha: Math.random() * 0.6 + 0.2,
                    twinkleSpeed: Math.random() * 0.02 + 0.005,
                    twinkleOffset: Math.random() * Math.PI * 2
                });
            }
        }

        function initAliens() {
            aliens = [];
            var totalW = ALIEN_COLS * ALIEN_W + (ALIEN_COLS - 1) * ALIEN_GAP_X;
            var startX = (CANVAS_W - totalW) / 2;
            var pointValues = [30, 20, 10, 10]; // row 0 = 30pts, row 1 = 20, rows 2-3 = 10
            for (var row = 0; row < ALIEN_ROWS; row++) {
                for (var col = 0; col < ALIEN_COLS; col++) {
                    aliens.push({
                        x: startX + col * (ALIEN_W + ALIEN_GAP_X),
                        y: ALIEN_TOP_PAD + row * (ALIEN_H + ALIEN_GAP_Y),
                        row: row,
                        col: col,
                        points: pointValues[row],
                        alive: true
                    });
                }
            }
        }

        function getAliveAliens() {
            var result = [];
            for (var i = 0; i < aliens.length; i++) {
                if (aliens[i].alive) result.push(aliens[i]);
            }
            return result;
        }

        function getBottomMostAlienInCol(col) {
            var bottom = null;
            for (var i = aliens.length - 1; i >= 0; i--) {
                if (aliens[i].col === col && aliens[i].alive) {
                    if (!bottom || aliens[i].row > bottom.row) {
                        bottom = aliens[i];
                    }
                }
            }
            return bottom;
        }

        function getAlienDirection() {
            // Determine direction based on current position
            var alive = getAliveAliens();
            if (alive.length === 0) return { x: 1, y: 0 };

            var minX = Infinity, maxX = -Infinity;
            for (var i = 0; i < alive.length; i++) {
                if (alive[i].x < minX) minX = alive[i].x;
                if (alive[i].x + ALIEN_W > maxX) maxX = alive[i].x + ALIEN_W;
            }

            // We store direction in the state; check edges against current direction
            return { x: alienDir.x, y: 0 };
        }

        // ── Alien Shapes (pixel-art-style rectangles) ──
        function drawAlienShape(x, y, row) {
            var cx = x + ALIEN_W / 2;
            var cy = y + ALIEN_H / 2;
            var s = 2; // cell size

            if (row === 0) {
                // Type 1: 30pts — crab-like shape (pink)
                ctx.fillStyle = '#f472b6';
                ctx.shadowColor = 'rgba(244, 114, 182, 0.5)';
                ctx.shadowBlur = 6;
                // Body
                ctx.fillRect(cx - 3 * s, cy - 3 * s, 6 * s, 6 * s);
                // Ears/antennae
                ctx.fillRect(cx - 4 * s, cy - 4 * s, 2 * s, 2 * s);
                ctx.fillRect(cx + 2 * s, cy - 4 * s, 2 * s, 2 * s);
                // Eyes (dark)
                ctx.fillStyle = '#0a0a1a';
                ctx.fillRect(cx - 2 * s, cy - 1 * s, s, s);
                ctx.fillRect(cx + s, cy - 1 * s, s, s);
                // Legs
                ctx.fillStyle = '#f472b6';
                ctx.shadowColor = 'rgba(244, 114, 182, 0.3)';
                ctx.fillRect(cx - 4 * s, cy + 2 * s, s, s);
                ctx.fillRect(cx + 3 * s, cy + 2 * s, s, s);
            } else if (row === 1) {
                // Type 2: 20pts — diamond shape (purple)
                ctx.fillStyle = '#a78bfa';
                ctx.shadowColor = 'rgba(167, 139, 250, 0.5)';
                ctx.shadowBlur = 6;
                // Diamond body
                ctx.fillRect(cx - 2 * s, cy - 3 * s, 4 * s, s);
                ctx.fillRect(cx - 3 * s, cy - 2 * s, 6 * s, s);
                ctx.fillRect(cx - 3 * s, cy - s, 6 * s, s);
                ctx.fillRect(cx - 2 * s, cy, 4 * s, s);
                ctx.fillRect(cx - 1 * s, cy + s, 2 * s, s);
                // Eyes
                ctx.fillStyle = '#0a0a1a';
                ctx.fillRect(cx - 1 * s, cy - 2 * s, s, s);
                ctx.fillRect(cx + s, cy - 2 * s, s, s);
            } else {
                // Type 3: 10pts — square shape with details (green)
                ctx.fillStyle = '#4ade80';
                ctx.shadowColor = 'rgba(74, 222, 128, 0.5)';
                ctx.shadowBlur = 6;
                // Body
                ctx.fillRect(cx - 3 * s, cy - 2 * s, 6 * s, 4 * s);
                ctx.fillRect(cx - 2 * s, cy - s, 4 * s, s);
                ctx.fillRect(cx - s, cy + 2 * s, 2 * s, s);
                // Eyes
                ctx.fillStyle = '#0a0a1a';
                ctx.fillRect(cx - 2 * s, cy - 1 * s, s, s);
                ctx.fillRect(cx + s, cy - 1 * s, s, s);
            }
            ctx.shadowColor = 'transparent';
            ctx.shadowBlur = 0;
        }

        // ── Drawing ──
        function drawStars(time) {
            for (var i = 0; i < stars.length; i++) {
                var star = stars[i];
                var twinkle = Math.sin(time * star.twinkleSpeed + star.twinkleOffset) * 0.3 + 0.7;
                ctx.fillStyle = 'rgba(255, 255, 255, ' + (star.alpha * twinkle) + ')';
                ctx.fillRect(star.x, star.y, star.size, star.size);
            }
        }

        function drawPlayer() {
            var cx = player.x + PLAYER_W / 2;
            ctx.fillStyle = '#22d3ee';
            ctx.shadowColor = 'rgba(34, 211, 238, 0.5)';
            ctx.shadowBlur = 8;
            // Triangular ship
            ctx.beginPath();
            ctx.moveTo(cx, player.y);           // tip
            ctx.lineTo(player.x + PLAYER_W, player.y + PLAYER_H); // bottom right
            ctx.lineTo(player.x + PLAYER_W - 4, player.y + PLAYER_H - 4);
            ctx.lineTo(player.x + 4, player.y + PLAYER_H - 4);
            ctx.lineTo(player.x, player.y + PLAYER_H); // bottom left
            ctx.closePath();
            ctx.fill();
            // Cockpit
            ctx.fillStyle = '#67e8f9';
            ctx.fillRect(cx - 2, player.y + 4, 4, 6);
            ctx.shadowColor = 'transparent';
            ctx.shadowBlur = 0;
        }

        function drawBullet() {
            if (playerBullet) {
                ctx.fillStyle = '#4ade80';
                ctx.shadowColor = 'rgba(74, 222, 128, 0.6)';
                ctx.shadowBlur = 6;
                ctx.fillRect(playerBullet.x, playerBullet.y, BULLET_W, BULLET_H);
                ctx.shadowColor = 'transparent';
                ctx.shadowBlur = 0;
            }
        }

        function drawAlienBullets() {
            for (var i = 0; i < alienBullets.length; i++) {
                var ab = alienBullets[i];
                ctx.fillStyle = '#f87171';
                ctx.shadowColor = 'rgba(248, 113, 113, 0.6)';
                ctx.shadowBlur = 6;
                ctx.fillRect(ab.x, ab.y, ALIEN_BULLET_W, ALIEN_BULLET_H);
                ctx.shadowColor = 'transparent';
                ctx.shadowBlur = 0;
            }
        }

        function drawAliens() {
            for (var i = 0; i < aliens.length; i++) {
                var a = aliens[i];
                if (!a.alive) continue;
                drawAlienShape(a.x, a.y, a.row);
            }
        }

        function render(time) {
            // Clear canvas with dark space background
            ctx.fillStyle = '#0a0a1a';
            ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);

            drawStars(time);
            drawAliens();
            drawPlayer();
            drawBullet();
            drawAlienBullets();
        }

        // ── Game Logic ──
        var alienDir = { x: 1, y: 0 };
        var alienStepTimer = 0;
        var alienStepInterval = 30; // frames between moves

        function getAlienSpeed() {
            var alive = getAliveAliens();
            var totalAliens = aliens.length;
            var remaining = alive.length;
            if (remaining === 0) return BASE_ALIEN_SPEED;
            return BASE_ALIEN_SPEED * (totalAliens / remaining) * (1 + (wave - 1) * 0.15);
        }

        function getAlienBulletRate() {
            // Rate increases over time and with waves
            var elapsed = performance.now() - gameStateStartTime;
            var rateDecrease = elapsed * 0.005; // gradually decrease interval
            var waveIncrease = (wave - 1) * 150;
            return Math.max(MIN_ALIEN_BULLET_RATE, BASE_ALIEN_BULLET_RATE - rateDecrease - waveIncrease);
        }

        var gameStateStartTime = 0;

        function updatePlayer() {
            if (keysDown['ArrowLeft']) {
                player.x -= PLAYER_SPEED;
                if (player.x < 0) player.x = 0;
            }
            if (keysDown['ArrowRight']) {
                player.x += PLAYER_SPEED;
                if (player.x + PLAYER_W > CANVAS_W) player.x = CANVAS_W - PLAYER_W;
            }
        }

        function updatePlayerBullet(dt) {
            if (!playerBullet) return;
            playerBullet.y -= BULLET_SPEED;

            // Check if bullet went off screen
            if (playerBullet.y + BULLET_H < 0) {
                playerBullet = null;
                return;
            }

            // Check collision with aliens
            for (var i = 0; i < aliens.length; i++) {
                var a = aliens[i];
                if (!a.alive) continue;
                if (playerBullet.x < a.x + ALIEN_W &&
                    playerBullet.x + BULLET_W > a.x &&
                    playerBullet.y < a.y + ALIEN_H &&
                    playerBullet.y + BULLET_H > a.y) {
                    a.alive = false;
                    score += a.points;
                    scoreDisplay.textContent = 'Score: ' + score;
                    playerBullet = null;
                    return;
                }
            }
        }

        function updateAliens() {
            var alive = getAliveAliens();
            if (alive.length === 0) {
                // Wave cleared - next wave
                wave++;
                waveDisplay.textContent = 'Wave: ' + wave;
                initAliens();
                alienBullets = [];
                return;
            }

            var speed = getAlienSpeed();
            alienStepTimer++;

            // Speed up as fewer aliens remain (step interval decreases)
            var stepInterval = Math.max(3, Math.floor(30 - (32 - alive.length) * 0.8));
            if (alienStepTimer >= stepInterval) {
                alienStepTimer = 0;

                for (var i = 0; i < alive.length; i++) {
                    alive[i].x += speed * alienDir.x * 8;
                }

                // Check edge collision
                var leftEdge = Infinity;
                var rightEdge = -Infinity;
                for (var i = 0; i < alive.length; i++) {
                    if (alive[i].x + ALIEN_W > rightEdge) rightEdge = alive[i].x + ALIEN_W;
                    if (alive[i].x < leftEdge) leftEdge = alive[i].x;
                }

                if (rightEdge >= CANVAS_W - 2 || leftEdge <= 2) {
                    alienDir.x *= -1;
                    for (var i = 0; i < alive.length; i++) {
                        alive[i].y += ALIEN_H + ALIEN_GAP_Y;
                    }
                    // Check if aliens reached player row
                    for (var i = 0; i < alive.length; i++) {
                        if (alive[i].y + ALIEN_H >= player.y) {
                            loseLife();
                            return;
                        }
                    }
                }
            }
        }

        function updateAlienBullets(now) {
            var bulletRate = getAlienBulletRate();

            if (now - lastAlienShoot >= bulletRate) {
                lastAlienShoot = now;
                var alive = getAliveAliens();
                if (alive.length === 0) return;

                // Get unique columns from bottom-most alive aliens
                var bottomCols = {};
                for (var i = 0; i < alive.length; i++) {
                    var col = alive[i].col;
                    if (!bottomCols[col] || alive[i].row > bottomCols[col].row) {
                        bottomCols[col] = alive[i];
                    }
                }

                // Pick one or two columns to shoot
                var cols = Object.keys(bottomCols);
                var numShooters = Math.min(cols.length, Math.ceil(cols.length * 0.3));
                if (numShooters < 1 && cols.length > 0) numShooters = 1;

                for (var i = 0; i < numShooters; i++) {
                    var idx = Math.floor(Math.random() * cols.length);
                    var shooter = bottomCols[cols[idx]];
                    if (shooter) {
                        alienBullets.push({
                            x: shooter.x + ALIEN_W / 2 - ALIEN_BULLET_W / 2,
                            y: shooter.y + ALIEN_H
                        });
                    }
                }
            }

            // Move alien bullets
            for (var i = alienBullets.length - 1; i >= 0; i--) {
                alienBullets[i].y += ALIEN_BULLET_SPEED;

                // Check if bullet went off screen
                if (alienBullets[i].y > CANVAS_H) {
                    alienBullets.splice(i, 1);
                    continue;
                }

                // Check collision with player
                var ab = alienBullets[i];
                if (ab.x < player.x + PLAYER_W &&
                    ab.x + ALIEN_BULLET_W > player.x &&
                    ab.y < player.y + PLAYER_H &&
                    ab.y + ALIEN_BULLET_H > player.y) {
                    alienBullets.splice(i, 1);
                    loseLife();
                    continue;
                }
            }
        }

        function loseLife() {
            lives--;
            if (lives <= 0) {
                lives = 0;
                updateLivesDisplay();
                endGame();
                return;
            }
            updateLivesDisplay();
            player.x = (CANVAS_W - PLAYER_W) / 2;
            playerBullet = null;
            alienBullets = [];
        }

        function updateLivesDisplay() {
            var hearts = '';
            for (var i = 0; i < lives; i++) hearts += '❤️';
            livesDisplay.textContent = hearts;
        }

        // ── Game Flow ──
        function initGame() {
            player.x = (CANVAS_W - PLAYER_W) / 2;
            playerBullet = null;
            initAliens();
            alienBullets = [];
            alienDir = { x: 1, y: 0 };
            alienStepTimer = 0;
            score = 0;
            lives = 3;
            wave = 1;
            lastAlienShoot = performance.now();
            gameStateStartTime = performance.now();
            scoreDisplay.textContent = 'Score: 0';
            waveDisplay.textContent = 'Wave: 1';
            updateLivesDisplay();
        }

        function startGame() {
            initGame();
            gameState = 'playing';
            startOverlay.classList.add('hidden');
            gameOverOverlay.classList.add('hidden');
            if (animFrameId) cancelAnimationFrame(animFrameId);
            animFrameId = requestAnimationFrame(gameLoop);
        }

        function endGame() {
            gameState = 'gameover';
            if (animFrameId) {
                cancelAnimationFrame(animFrameId);
                animFrameId = null;
            }

            // Update high score
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('spaceInvadersHighScore', highScore.toString());
            }

            // Show game over overlay
            finalScoreEl.textContent = 'Score: ' + score;
            finalHighScoreEl.textContent = highScore;
            gameOverOverlay.classList.remove('hidden');
        }

        function gameLoop(timestamp) {
            if (gameState !== 'playing') return;

            updatePlayer();
            updatePlayerBullet();
            updateAliens();
            updateAlienBullets(timestamp);

            render(timestamp);
            animFrameId = requestAnimationFrame(gameLoop);
        }

        // ── Input Handling ──
        document.addEventListener('keydown', function(e) {
            // Prevent default scrolling for arrow keys and space
            if (e.key === 'ArrowLeft' || e.key === 'ArrowRight' || e.key === ' ' || e.key === 'ArrowUp' || e.key === 'ArrowDown') {
                e.preventDefault();
            }

            // Start game on Enter from start screen
            if (gameState === 'start' && e.key === 'Enter') {
                startGame();
                return;
            }

            // Restart on Enter from game over screen
            if (gameState === 'gameover' && (e.key === 'Enter' || e.key === ' ')) {
                startGame();
                return;
            }

            if (gameState !== 'playing') return;

            if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
                keysDown[e.key] = true;
            }

            // Fire bullet (space) — only one at a time
            if (e.key === ' ' && !playerBullet) {
                playerBullet = {
                    x: player.x + PLAYER_W / 2 - BULLET_W / 2,
                    y: player.y - BULLET_H
                };
            }
        });

        document.addEventListener('keyup', function(e) {
            if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
                keysDown[e.key] = false;
            }
        });

        // ── Button Handlers ──
        startBtn.addEventListener('click', function() {
            startGame();
        });

        restartBtn.addEventListener('click', function() {
            startGame();
        });

        // ── Initial Draw ──
        initStars();
        initGame();
        render(0);

    })();
    </script>
</body>
</html>
