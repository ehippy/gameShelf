<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>gameShelf — Tic Tac Toe</title>
    <style>
        /* CSS Custom Properties — match site theme */
        :root {
            --bg-primary: #0f0f23;
            --bg-secondary: #1a1a3e;
            --bg-card: #1e1e45;
            --text-primary: #e0e0e0;
            --text-secondary: #a0a0b8;
            --text-muted: #6b6b80;
            --accent: #00d4ff;
            --accent-hover: #00b8d9;
            --accent-glow: rgba(0, 212, 255, 0.3);
            --border-color: #2a2a5a;
            --header-bg: rgba(15, 15, 35, 0.95);
            --footer-bg: #0a0a1a;
            --x-color: #00d4ff;
            --o-color: #f87171;
        }

        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        .game-header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: var(--header-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            padding: 0.75rem 1.5rem;
        }

        .header-inner {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: var(--accent);
            text-shadow: 0 0 10px var(--accent-glow);
            white-space: nowrap;
            transition: text-shadow 0.2s ease;
        }

        .logo:hover {
            text-shadow: 0 0 20px var(--accent-glow), 0 0 40px rgba(0, 212, 255, 0.1);
        }

        .logo::before {
            content: '🎮';
            margin-right: 0.35rem;
        }

        .game-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .back-link {
            color: var(--accent);
            font-size: 0.9rem;
            font-weight: 500;
            transition: color 0.2s ease;
            white-space: nowrap;
        }

        .back-link:hover {
            color: var(--accent-hover);
            text-shadow: 0 0 10px var(--accent-glow);
        }

        /* Game Area */
        .game-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem 1.5rem;
        }

        /* HUD Bar */
        .hud-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 2rem;
            margin-bottom: 1.5rem;
            padding: 0.5rem 1.5rem;
            background: var(--bg-secondary);
            border: 2px solid var(--border-color);
            border-radius: 0.5rem;
            min-width: 400px;
        }

        .turn-indicator {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .turn-x {
            color: var(--x-color);
        }

        .turn-o {
            color: var(--o-color);
        }

        .record-display {
            font-size: 0.95rem;
            color: var(--text-secondary);
        }

        /* Canvas */
        .canvas-wrapper {
            position: relative;
            border: 2px solid var(--border-color);
            border-radius: 0.75rem;
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.1), 0 8px 24px rgba(0, 0, 0, 0.5);
            overflow: hidden;
        }

        canvas {
            display: block;
            background-color: #1a1a3e;
        }

        /* Overlay (Start / Game Over) */
        .overlay {
            position: absolute;
            inset: 0;
            background: rgba(15, 15, 35, 0.92);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            z-index: 10;
            border-radius: 0.75rem;
            transition: opacity 0.3s ease;
        }

        .overlay.hidden {
            display: none;
        }

        .overlay-title {
            font-size: 2rem;
            font-weight: 800;
            color: var(--text-primary);
            text-shadow: 0 0 20px var(--accent-glow);
        }

        .overlay-subtitle {
            font-size: 0.95rem;
            color: var(--text-secondary);
            text-align: center;
            max-width: 280px;
            line-height: 1.5;
        }

        /* Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            background: var(--accent);
            color: var(--bg-primary);
            font-size: 1rem;
            font-weight: 700;
            padding: 0.5rem 2rem;
            border-radius: 0.75rem;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.15);
            margin-top: 0.5rem;
        }

        .btn:hover {
            background: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        /* Footer */
        .site-footer {
            margin-top: auto;
            background: var(--footer-bg);
            border-top: 1px solid var(--border-color);
            padding: 2rem 1.5rem;
        }

        .footer-inner {
            max-width: 1200px;
            margin: 0 auto;
            text-align: center;
        }

        .footer-links {
            display: flex;
            justify-content: center;
            gap: 3rem;
            margin-bottom: 0.5rem;
        }

        .footer-links a {
            color: var(--text-muted);
            font-size: 0.85rem;
            transition: color 0.2s ease;
        }

        .footer-links a:hover {
            color: var(--accent);
        }

        .site-footer p {
            color: var(--text-muted);
            font-size: 0.8rem;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .header-inner {
                justify-content: center;
                text-align: center;
            }
            .hud-bar {
                min-width: 320px;
                gap: 0.5rem;
            }
            .overlay-title {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="game-header">
        <div class="header-inner">
            <div class="header-left">
                <a href="../index.html" class="logo">gameShelf</a>
                <span class="game-title">Tic Tac Toe</span>
            </div>
            <a href="../index.html" class="back-link">← Back to All Games</a>
        </div>
    </header>

    <!-- Game Area -->
    <div class="game-area">
        <!-- HUD Bar -->
        <div class="hud-bar">
            <span class="turn-indicator turn-x" id="turnIndicator">Your Turn: X</span>
            <span class="record-display" id="recordDisplay">Wins: 0 | Losses: 0 | Draws: 0</span>
        </div>

        <!-- Canvas -->
        <div class="canvas-wrapper">
            <canvas id="gameCanvas" width="400" height="400"></canvas>

            <!-- Start Overlay -->
            <div class="overlay" id="startOverlay">
                <div class="overlay-title">❌ Tic Tac Toe</div>
                <div class="overlay-subtitle">Click a cell or use arrow keys + Enter to place. Get three in a row to win!</div>
                <button class="btn" id="startBtn">▶ Start Game</button>
            </div>

            <!-- Game Over Overlay -->
            <div class="overlay hidden" id="gameOverOverlay">
                <div class="overlay-title" id="gameOverTitle">Game Over</div>
                <div class="overlay-subtitle" id="gameOverSubtitle">Result message here</div>
                <div id="recordSummary" style="font-size:0.85rem; color:var(--text-muted); margin-top:0.25rem;"></div>
                <button class="btn" id="restartBtn">↻ Restart</button>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="site-footer">
        <div class="footer-inner">
            <div class="footer-links">
                <a href="../index.html">Home</a>
                <a href="../index.html">All Games</a>
            </div>
            <p>© 2025 gameShelf — All games built in browser — no downloads required</p>
        </div>
    </footer>

    <script>
    (function() {
        'use strict';

        // ── Constants ──
        const CANVAS_SIZE = 400;
        const GRID = 3;
        const CELL = CANVAS_SIZE / GRID; // 133.333...
        const LINE_COLOR = '#3a3a6e';
        const LINE_WIDTH = 3;
        const X_COLOR = '#00d4ff';
        const O_COLOR = '#f87171';
        const CURSOR_COLOR = 'rgba(0, 212, 255, 0.25)';
        const X_PADDING = 15;
        const O_RADIUS = 45;
        const WIN_LINE_WIDTH = 6;

        // Win combinations (row, col pairs)
        const WIN_LINES = [
            // Rows
            [[0, 0], [0, 1], [0, 2]],
            [[1, 0], [1, 1], [1, 2]],
            [[2, 0], [2, 1], [2, 2]],
            // Columns
            [[0, 0], [1, 0], [2, 0]],
            [[0, 1], [1, 1], [2, 1]],
            [[0, 2], [1, 2], [2, 2]],
            // Diagonals
            [[0, 0], [1, 1], [2, 2]],
            [[0, 2], [1, 1], [2, 0]]
        ];

        // ── DOM refs ──
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const startOverlay = document.getElementById('startOverlay');
        const gameOverOverlay = document.getElementById('gameOverOverlay');
        const gameOverTitle = document.getElementById('gameOverTitle');
        const gameOverSubtitle = document.getElementById('gameOverSubtitle');
        const startBtn = document.getElementById('startBtn');
        const restartBtn = document.getElementById('restartBtn');
        const turnIndicator = document.getElementById('turnIndicator');

        // ── Game State ──
        let board = [];      // 3x3 array: 'X' | 'O' | null
        let cursorX = 0;     // cursor column (0-2)
        let cursorY = 0;     // cursor row (0-2)
        let gameState = 'start'; // 'start', 'playing', 'gameover'
        let winner = null;   // 'X', 'O', 'draw', or null
        let winLine = [];    // array of [row, col] for winning cells
        let aiThinking = false;

        // ── Board Initialization ──
        function initBoard() {
            board = [
                [null, null, null],
                [null, null, null],
                [null, null, null]
            ];
            cursorX = 0;
            cursorY = 0;
            winner = null;
            winLine = [];
            aiThinking = false;
        }

        // ── Win/Draw Detection ──
        function checkWinner() {
            // Check all win lines
            for (var i = 0; i < WIN_LINES.length; i++) {
                var line = WIN_LINES[i];
                var cells = [board[line[0][0]][line[0][1]],
                             board[line[1][0]][line[1][1]],
                             board[line[2][0]][line[2][1]]];
                if (cells[0] !== null && cells[0] === cells[1] && cells[1] === cells[2]) {
                    return { winner: cells[0], line: line };
                }
            }
            // Check draw
            for (var r = 0; r < 3; r++) {
                for (var c = 0; c < 3; c++) {
                    if (board[r][c] === null) return null;
                }
            }
            return { winner: 'draw', line: [] };
        }

        // ── Minimax AI ──
        function minimax(b, depth, isMaximizing, alpha, beta) {
            var result = checkBoardState(b);
            if (result !== null) {
                if (result === 'O') return 10 - depth;
                if (result === 'X') return depth - 10;
                return 0; // draw
            }

            if (isMaximizing) {
                var bestScore = -Infinity;
                for (var r = 0; r < 3; r++) {
                    for (var c = 0; c < 3; c++) {
                        if (b[r][c] === null) {
                            b[r][c] = 'O';
                            var score = minimax(b, depth + 1, false, alpha, beta);
                            b[r][c] = null;
                            bestScore = Math.max(score, bestScore);
                            alpha = Math.max(alpha, score);
                            if (beta <= alpha) break;
                        }
                    }
                    if (beta <= alpha) break;
                }
                return bestScore;
            } else {
                var bestScore = Infinity;
                for (var r = 0; r < 3; r++) {
                    for (var c = 0; c < 3; c++) {
                        if (b[r][c] === null) {
                            b[r][c] = 'X';
                            var score = minimax(b, depth + 1, true, alpha, beta);
                            b[r][c] = null;
                            bestScore = Math.min(score, bestScore);
                            beta = Math.min(beta, score);
                            if (beta <= alpha) break;
                        }
                    }
                    if (beta <= alpha) break;
                }
                return bestScore;
            }
        }

        function checkBoardState(b) {
            // Check rows, columns, diagonals
            for (var i = 0; i < 3; i++) {
                // Rows
                if (b[i][0] !== null && b[i][0] === b[i][1] && b[i][1] === b[i][2]) {
                    return b[i][0];
                }
                // Columns
                if (b[0][i] !== null && b[0][i] === b[1][i] && b[1][i] === b[2][i]) {
                    return b[0][i];
                }
            }
            // Diagonals
            if (b[0][0] !== null && b[0][0] === b[1][1] && b[1][1] === b[2][2]) {
                return b[0][0];
            }
            if (b[0][2] !== null && b[0][2] === b[1][1] && b[1][1] === b[2][0]) {
                return b[0][2];
            }
            // Check for empty cells
            for (var r = 0; r < 3; r++) {
                for (var c = 0; c < 3; c++) {
                    if (b[r][c] === null) return null;
                }
            }
            return 'draw';
        }

        function aiMove() {
            if (aiThinking) return;
            aiThinking = true;

            // Simulate a small delay for better UX (so player sees their move first)
            setTimeout(function() {
                // Find best move using minimax
                var bestScore = -Infinity;
                var bestMoves = [];

                for (var r = 0; r < 3; r++) {
                    for (var c = 0; c < 3; c++) {
                        if (board[r][c] === null) {
                            board[r][c] = 'O';
                            var score = minimax(board, 0, false, -Infinity, Infinity);
                            board[r][c] = null;
                            if (score > bestScore) {
                                bestScore = score;
                                bestMoves = [{ r: r, c: c }];
                            } else if (score === bestScore) {
                                bestMoves.push({ r: r, c: c });
                            }
                        }
                    }
                }

                if (bestMoves.length > 0) {
                    // Pick randomly among equally best moves for variety
                    var move = bestMoves[Math.floor(Math.random() * bestMoves.length)];
                    board[move.r][move.c] = 'O';

                    // Check game state after AI move
                    var result = checkWinner();
                    if (result) {
                        winner = result.winner;
                        winLine = result.line;
                        gameState = 'gameover';
                        showGameOver(winner);
                        updateTurnIndicator();
                    }
                }

                aiThinking = false;
                render();
            }, 300);
        }

        // ── Rendering ──
        function render() {
            ctx.clearRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);

            // Draw background
            ctx.fillStyle = '#1a1a3e';
            ctx.fillRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);

            // Draw grid lines
            ctx.strokeStyle = LINE_COLOR;
            ctx.lineWidth = LINE_WIDTH;
            ctx.lineCap = 'round';

            // Vertical lines
            ctx.beginPath();
            ctx.moveTo(CELL, 0);
            ctx.lineTo(CELL, CANVAS_SIZE);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(CELL * 2, 0);
            ctx.lineTo(CELL * 2, CANVAS_SIZE);
            ctx.stroke();

            // Horizontal lines
            ctx.beginPath();
            ctx.moveTo(0, CELL);
            ctx.lineTo(CANVAS_SIZE, CELL);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(0, CELL * 2);
            ctx.lineTo(CANVAS_SIZE, CELL * 2);
            ctx.stroke();

            // Draw X marks
            for (var r = 0; r < 3; r++) {
                for (var c = 0; c < 3; c++) {
                    if (board[r][c] === 'X') {
                        drawX(c, r);
                    }
                }
            }

            // Draw O marks
            for (var r = 0; r < 3; r++) {
                for (var c = 0; c < 3; c++) {
                    if (board[r][c] === 'O') {
                        drawO(c, r);
                    }
                }
            }

            // Draw cursor highlight (only during playing state)
            if (gameState === 'playing' && !aiThinking) {
                ctx.fillStyle = CURSOR_COLOR;
                ctx.fillRect(cursorX * CELL + 2, cursorY * CELL + 2, CELL - 4, CELL - 4);
            }

            // Draw win line highlight
            if (gameState === 'gameover' && winLine.length > 0) {
                // Highlight winning cells with a brighter glow
                ctx.save();
                for (var i = 0; i < winLine.length; i++) {
                    var wr = winLine[i][0];
                    var wc = winLine[i][1];
                    ctx.shadowColor = winner === 'X' ? X_COLOR : O_COLOR;
                    ctx.shadowBlur = 20;
                    ctx.strokeStyle = winner === 'X' ? X_COLOR : O_COLOR;
                    ctx.lineWidth = WIN_LINE_WIDTH;
                    ctx.globalAlpha = 0.6;
                    ctx.strokeRect(wc * CELL + 3, wr * CELL + 3, CELL - 6, CELL - 6);
                }
                ctx.restore();
            }
        }

        function drawX(col, row) {
            var cx = col * CELL + CELL / 2;
            var cy = row * CELL + CELL / 2;
            var pad = X_PADDING;
            var x1 = col * CELL + pad;
            var x2 = col * CELL + CELL - pad;
            var y1 = row * CELL + pad;
            var y2 = row * CELL + CELL - pad;

            ctx.strokeStyle = X_COLOR;
            ctx.lineWidth = 5;
            ctx.lineCap = 'round';

            // Glow effect
            ctx.save();
            ctx.shadowColor = X_COLOR;
            ctx.shadowBlur = 10;

            // Diagonal from bottom-left to top-right
            ctx.beginPath();
            ctx.moveTo(x1, y2);
            ctx.lineTo(x2, y1);
            ctx.stroke();

            // Diagonal from top-left to bottom-right
            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(x2, y2);
            ctx.stroke();

            ctx.restore();
        }

        function drawO(col, row) {
            var cx = col * CELL + CELL / 2;
            var cy = row * CELL + CELL / 2;
            var r = O_RADIUS;

            ctx.strokeStyle = O_COLOR;
            ctx.lineWidth = 5;
            ctx.lineCap = 'round';

            // Glow effect
            ctx.save();
            ctx.shadowColor = O_COLOR;
            ctx.shadowBlur = 10;

            ctx.beginPath();
            ctx.arc(cx, cy, r, 0, Math.PI * 2);
            ctx.stroke();

            ctx.restore();
        }

        // ── Game Flow ──
        function startGame() {
            initBoard();
            gameState = 'playing';
            startOverlay.classList.add('hidden');
            gameOverOverlay.classList.add('hidden');
            updateTurnIndicator();
            render();
        }

        function showGameOver(result) {
            gameOverOverlay.classList.remove('hidden');

            if (result === 'X') {
                gameOverTitle.textContent = 'You Win!';
                gameOverTitle.style.color = X_COLOR;
                gameOverSubtitle.textContent = 'Great play! You got three in a row!';
            } else if (result === 'O') {
                gameOverTitle.textContent = 'AI Wins!';
                gameOverTitle.style.color = O_COLOR;
                gameOverSubtitle.textContent = 'The AI got three in a row. Try again!';
            } else {
                gameOverTitle.textContent = "Draw!";
                gameOverTitle.style.color = '#a0a0b8';
                gameOverSubtitle.textContent = 'All cells filled — no winner this time.';
            }

            updateTurnIndicator();
        }

        function restart() {
            gameOverOverlay.classList.add('hidden');
            gameOverTitle.style.color = '';
            startOverlay.classList.remove('hidden');
            initBoard();
            gameState = 'start';
            updateTurnIndicator();
            render();
        }

        function updateTurnIndicator() {
            if (gameState === 'playing') {
                if (aiThinking) {
                    turnIndicator.textContent = 'AI is thinking...';
                    turnIndicator.className = 'turn-indicator turn-o';
                } else {
                    turnIndicator.textContent = 'Your Turn: X';
                    turnIndicator.className = 'turn-indicator turn-x';
                }
            } else if (gameState === 'gameover') {
                if (winner === 'X') {
                    turnIndicator.textContent = 'You Win!';
                    turnIndicator.className = 'turn-indicator turn-x';
                } else if (winner === 'O') {
                    turnIndicator.textContent = 'AI Wins!';
                    turnIndicator.className = 'turn-indicator turn-o';
                } else {
                    turnIndicator.textContent = 'Game Over — Draw';
                    turnIndicator.className = 'turn-indicator';
                }
            }
        }

        // ── Player Move ──
        function playerPlace() {
            if (gameState !== 'playing' || aiThinking) return;
            if (board[cursorY][cursorX] !== null) return;

            // Place X at cursor position
            board[cursorY][cursorX] = 'X';

            // Check for win/draw
            var result = checkWinner();
            if (result) {
                winner = result.winner;
                winLine = result.line;
                gameState = 'gameover';
                showGameOver(winner);
                updateTurnIndicator();
                render();
                return;
            }

            // AI's turn
            updateTurnIndicator();
            render();
            aiMove();
        }

        // ── Input Handling ──
        var KEY_MAP = {
            'ArrowUp':    { x: 0, y: -1 },
            'ArrowDown':  { x: 0, y: 1 },
            'ArrowLeft':  { x: -1, y: 0 },
            'ArrowRight': { x: 1, y: 0 }
        };

        document.addEventListener('keydown', function(e) {
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Enter', ' '].includes(e.key)) {
                e.preventDefault();
            }

            if (gameState === 'start') {
                if (e.key === 'Enter' || e.key === ' ') {
                    startGame();
                }
                return;
            }

            if (gameState === 'gameover') {
                if (e.key === 'Enter' || e.key === ' ') {
                    restart();
                }
                return;
            }

            if (gameState !== 'playing') return;

            var move = KEY_MAP[e.key];
            if (move) {
                cursorX += move.x;
                cursorY += move.y;
                // Clamp to grid
                if (cursorX < 0) cursorX = 0;
                if (cursorX >= 3) cursorX = 2;
                if (cursorY < 0) cursorY = 0;
                if (cursorY >= 3) cursorY = 2;
                render();
                return;
            }

            if (e.key === 'Enter' || e.key === ' ') {
                playerPlace();
            }
        });

        // ── Mouse Click Handler ──
        canvas.addEventListener('click', function(e) {
            e.preventDefault();
            if (gameState !== 'playing' || aiThinking) return;

            // Get click position relative to canvas
            var rect = canvas.getBoundingClientRect();
            var clickX = e.clientX - rect.left;
            var clickY = e.clientY - rect.top;

            // Convert to grid coordinates
            var col = Math.floor(clickX / CELL);
            var row = Math.floor(clickY / CELL);

            // Clamp to grid bounds (0-2)
            col = Math.max(0, Math.min(2, col));
            row = Math.max(0, Math.min(2, row));

            // Only place if cell is empty
            if (board[row][col] === null) {
                board[row][col] = 'X';

                // Check for win/draw
                var result = checkWinner();
                if (result) {
                    winner = result.winner;
                    winLine = result.line;
                    gameState = 'gameover';
                    showGameOver(winner);
                    updateTurnIndicator();
                    render();
                    return;
                }

                // AI's turn
                updateTurnIndicator();
                render();
                aiMove();
            }
        });

        // ── Button Handlers ──
        startBtn.addEventListener('click', function() {
            startGame();
        });

        restartBtn.addEventListener('click', function() {
            restart();
        });

        // ── Initial Setup ──
        initBoard();
        render();

    })();
    </script>
</body>
</html>
