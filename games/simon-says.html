<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Simon Says — gameShelf</title>
    <link rel="stylesheet" href="../styles.css">
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: #0f0f23;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            -webkit-user-select: none;
            user-select: none;
        }

        .game-header {
            width: 100%;
            background: rgba(15, 15, 35, 0.95);
            border-bottom: 1px solid #2a2a5a;
            padding: 0.75rem 1.25rem;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .game-header-inner {
            max-width: 700px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            color: #a0a0b8;
            font-size: 0.9rem;
            font-weight: 500;
            text-decoration: none;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: #fbbf24;
        }

        .back-link::before {
            content: '←';
            font-size: 1.1rem;
        }

        .game-title-header {
            font-size: 1.4rem;
            font-weight: 800;
            background: linear-gradient(135deg, #fb7185, #e11d48);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .game-container {
            max-width: 460px;
            width: 95%;
            margin: 1.5rem auto 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
        }

        .hud-bar {
            display: flex;
            justify-content: center;
            width: 100%;
            padding: 0.6rem 1rem;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            font-size: 1.2rem;
            font-weight: 700;
            color: #fbbf24;
            letter-spacing: 1px;
        }

        .canvas-wrapper {
            position: relative;
            width: 400px;
            max-width: 95vw;
            aspect-ratio: 1;
            border-radius: var(--radius-md);
            overflow: hidden;
            background: #1a1a3e;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        #game-canvas {
            display: block;
            width: 100%;
            height: 100%;
            cursor: pointer;
            touch-action: none;
        }

        .overlay {
            position: absolute;
            inset: 0;
            background: rgba(15, 15, 35, 0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: var(--radius-md);
            z-index: 10;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .overlay-title {
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #fb7185, #e11d48);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .overlay-subtitle {
            font-size: 1rem;
            color: #a0a0b8;
            margin-bottom: 0.5rem;
            text-align: center;
            max-width: 80%;
        }

        .overlay-score {
            font-size: 2.5rem;
            font-weight: 800;
            color: #fbbf24;
            margin: 0.5rem 0 1.5rem;
        }

        .overlay-btn {
            background: linear-gradient(135deg, #fb7185, #e11d48);
            color: #fff;
            border: none;
            border-radius: 0.5rem;
            padding: 0.7rem 2rem;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 2px 8px rgba(251, 113, 133, 0.25);
            margin: 0.25rem;
        }

        .overlay-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(251, 113, 133, 0.35);
        }

        .game-footer {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.8rem;
            padding: 1rem;
        }

        @media (max-width: 480px) {
            .canvas-wrapper {
                width: 100%;
                max-width: 95vw;
            }
            .overlay-title {
                font-size: 1.5rem;
            }
            .overlay-score {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <header class="game-header">
        <div class="game-header-inner">
            <a href="../index.html" class="logo">gameShelf</a>
            <span class="game-title-header">Simon Says</span>
            <a href="../games/index.html" class="back-link">All Games</a>
        </div>
    </header>

    <div class="game-container">
        <div class="hud-bar" id="hud">Round: 0</div>

        <div class="canvas-wrapper">
            <canvas id="game-canvas" width="400" height="400"></canvas>

            <!-- Start Overlay -->
            <div class="overlay active" id="startOverlay">
                <div class="overlay-title">🎵 Simon Says</div>
                <div class="overlay-subtitle">Watch the sequence, then repeat it!</div>
                <button class="overlay-btn" id="startBtn">▶ Start Game</button>
            </div>

            <!-- Game Over Overlay -->
            <div class="overlay" id="gameOverOverlay">
                <div class="overlay-title">Game Over!</div>
                <div class="overlay-subtitle">You reached</div>
                <div class="overlay-score" id="finalScore">0</div>
                <div class="overlay-subtitle">rounds</div>
                <button class="overlay-btn" id="newGameBtn">↻ New Game</button>
            </div>

            <!-- Correct Overlay -->
            <div class="overlay" id="correctOverlay">
                <div class="overlay-title">✓ Correct!</div>
                <div class="overlay-subtitle">Get ready for the next round...</div>
            </div>
        </div>
    </div>

    <footer class="site-footer">
        <div class="footer-inner">
            <div class="footer-links">
                <a href="../index.html">Home</a>
                <a href="../games/index.html">All Games</a>
                <a href="../about.html">About</a>
            </div>
            <p>© 2025 gameShelf — All games built in browser — no downloads required</p>
        </div>
    </footer>

    <script src="../script.js"></script>
    <script>
    (function() {
        'use strict';

        // === Constants ===
        const CANVAS_SIZE = 400;
        const BUTTON_COLORS = [
            { name: 'red',    base: '#e74c3c', lit: '#ff6b5a', dark: '#c0392b', freq: 261.63 },   // C4
            { name: 'green',  base: '#2ecc71', lit: '#4ade8a', dark: '#27ae60', freq: 329.63 },   // E4
            { name: 'blue',   base: '#3498db', lit: '#5dade2', dark: '#2980b9', freq: 392.00 },   // G4
            { name: 'yellow', base: '#f1c40f', lit: '#f5d542', dark: '#d4ac0d', freq: 493.88 }    // B4
        ];
        // Layout: [0]=top-left, [1]=top-right, [2]=bottom-left, [3]=bottom-right
        // Reading order for keyboard: 0 → 1 → 2 → 3

        const GAP = 10;
        const BORDER = 6;
        const BTN_W = (CANVAS_SIZE - GAP * 3) / 2;   // ~190
        const BTN_H = BTN_W;
        const POSITIONS = [
            { x: BORDER + GAP,        y: BORDER + GAP },         // 0: top-left
            { x: BORDER + GAP * 3 + BTN_W, y: BORDER + GAP },    // 1: top-right
            { x: BORDER + GAP,        y: BORDER + GAP * 3 + BTN_H }, // 2: bottom-left
            { x: BORDER + GAP * 3 + BTN_W, y: BORDER + GAP * 3 + BTN_H } // 3: bottom-right
        ];

        // === DOM refs ===
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        const hud = document.getElementById('hud');
        const startOverlay = document.getElementById('startOverlay');
        const gameOverOverlay = document.getElementById('gameOverOverlay');
        const correctOverlay = document.getElementById('correctOverlay');
        const finalScoreEl = document.getElementById('finalScore');
        const startBtn = document.getElementById('startBtn');
        const newGameBtn = document.getElementById('newGameBtn');

        // === Game State ===
        let sequence = [];
        let playerInputIndex = 0;
        let score = 0;
        let gameState = 'start';  // 'start', 'playing', 'showing', 'input', 'gameover'
        let litButton = -1;
        let wrongFlashTimer = null;

        // === Audio Context (created on first user interaction) ===
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playTone(freq, duration) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration / 1000);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(audioCtx.currentTime);
            osc.stop(audioCtx.currentTime + duration / 1000);
        }

        // === Drawing ===
        function drawButtons() {
            ctx.clearRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);

            for (let i = 0; i < 4; i++) {
                const btn = BUTTON_COLORS[i];
                const pos = POSITIONS[i];

                ctx.save();

                // Outer border
                ctx.fillStyle = '#1a1a3e';
                ctx.fillRect(
                    pos.x - BORDER, pos.y - BORDER,
                    BTN_W + BORDER * 2, BTN_H + BORDER * 2
                );

                // Main button
                const isLit = (litButton === i);
                ctx.fillStyle = isLit ? btn.lit : btn.base;
                ctx.fillRect(pos.x, pos.y, BTN_W, BTN_H);

                // Inner shadow
                ctx.fillStyle = btn.dark;
                const inner = 4;
                ctx.fillRect(pos.x + inner, pos.y + inner, BTN_W - inner * 2, BTN_H - inner * 2);

                // Highlight when lit
                if (isLit) {
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.25)';
                    ctx.fillRect(pos.x + 4, pos.y + 4, BTN_W - 8, BTN_H / 3);
                }

                ctx.restore();
            }
        }

        function drawWrongFlash() {
            ctx.fillStyle = 'rgba(231, 76, 60, 0.7)';
            ctx.fillRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);
        }

        // === Game Logic ===
        function getNextButton() {
            return Math.floor(Math.random() * 4);
        }

        function addRandomButton() {
            sequence.push(getNextButton());
        }

        function showSequence() {
            gameState = 'showing';
            hud.textContent = 'Watch...';
            litButton = -1;
            drawButtons();

            let i = 0;
            const interval = setInterval(() => {
                if (i >= sequence.length) {
                    clearInterval(interval);
                    gameState = 'input';
                    playerInputIndex = 0;
                    hud.textContent = 'Your turn! (Round ' + score + ')';
                    return;
                }

                const btnIdx = sequence[i];
                const btn = BUTTON_COLORS[btnIdx];

                // Flash
                litButton = btnIdx;
                drawButtons();
                playTone(btn.freq, 200);

                setTimeout(() => {
                    litButton = -1;
                    drawButtons();
                }, 400);

                i++;
            }, 550); // 400ms flash + 150ms gap
        }

        function startGame() {
            initAudio();
            sequence = [];
            score = 0;
            playerInputIndex = 0;
            litButton = -1;
            wrongFlashTimer = null;

            startOverlay.classList.remove('active');
            gameOverOverlay.classList.remove('active');
            correctOverlay.classList.remove('active');

            hud.textContent = 'Round: 0';

            // Start: generate first button
            addRandomButton();
            setTimeout(showSequence, 500);
        }

        function playerInput(btnIdx) {
            if (gameState !== 'input') return;

            const btn = BUTTON_COLORS[btnIdx];

            // Flash the button
            litButton = btnIdx;
            drawButtons();
            playTone(btn.freq, 200);

            setTimeout(() => {
                litButton = -1;
                drawButtons();
            }, 200);

            // Check correctness
            if (btnIdx !== sequence[playerInputIndex]) {
                // Wrong!
                wrongFlashTimer = setTimeout(() => {
                    litButton = -1;
                    drawButtons();
                }, 300);
                drawWrongFlash();
                playTone(100, 300);

                setTimeout(() => {
                    gameState = 'gameover';
                    finalScoreEl.textContent = score;
                    gameOverOverlay.classList.add('active');
                }, 500);
                return;
            }

            playerInputIndex++;

            // Sequence complete?
            if (playerInputIndex >= sequence.length) {
                score++;
                hud.textContent = 'Round: ' + score;

                // Show correct overlay briefly
                correctOverlay.classList.add('active');
                playTone(600, 150);
                setTimeout(() => {
                    correctOverlay.classList.remove('active');
                    addRandomButton();
                    showSequence();
                }, 1000);
            }
        }

        function resetGame() {
            gameOverOverlay.classList.remove('active');
            startOverlay.classList.add('active');
            gameState = 'start';
            sequence = [];
            score = 0;
            litButton = -1;
            hud.textContent = 'Round: 0';
        }

        // === Input Handling ===
        function getButtonFromPoint(px, py) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = CANVAS_SIZE / rect.width;
            const scaleY = CANVAS_SIZE / rect.height;
            const x = (px - rect.left) * scaleX;
            const y = (py - rect.top) * scaleY;

            for (let i = 0; i < 4; i++) {
                const pos = POSITIONS[i];
                if (x >= pos.x && x <= pos.x + BTN_W &&
                    y >= pos.y && y <= pos.y + BTN_H) {
                    return i;
                }
            }
            return -1;
        }

        function handleInput(e) {
            if (gameState !== 'input') return;
            const btnIdx = getButtonFromPoint(e.clientX, e.clientY);
            if (btnIdx >= 0) {
                playerInput(btnIdx);
            }
        }

        canvas.addEventListener('click', handleInput);
        canvas.addEventListener('touchstart', function(e) {
            e.preventDefault();
            if (e.touches.length > 0) {
                handleInput(e.touches[0]);
            }
        }, { passive: false });

        // Keyboard: Arrow keys navigate, Enter/Space confirms
        // Reading order: 0→1→2→3
        let kbIndex = 0;
        document.addEventListener('keydown', function(e) {
            if (gameState === 'start') {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    startGame();
                }
                return;
            }

            if (gameState === 'gameover') {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    resetGame();
                }
                return;
            }

            if (gameState !== 'input') return;

            switch (e.key) {
                case 'ArrowLeft':
                    e.preventDefault();
                    // Read order: left column = 0,2 | right column = 1,3
                    // Going left: stay in same row (0→2, 1→3)
                    if (kbIndex === 1) kbIndex = 3;
                    else if (kbIndex === 3) kbIndex = 1;
                    break;
                case 'ArrowRight':
                    e.preventDefault();
                    if (kbIndex === 0) kbIndex = 2;
                    else if (kbIndex === 2) kbIndex = 0;
                    break;
                case 'ArrowUp':
                    e.preventDefault();
                    // Go up: same column (2→0, 3→1)
                    if (kbIndex === 2) kbIndex = 0;
                    else if (kbIndex === 3) kbIndex = 1;
                    break;
                case 'ArrowDown':
                    e.preventDefault();
                    // Go down: same column (0→2, 1→3)
                    if (kbIndex === 0) kbIndex = 2;
                    else if (kbIndex === 1) kbIndex = 3;
                    break;
                case 'Enter':
                case ' ':
                    e.preventDefault();
                    playerInput(kbIndex);
                    break;
            }
        });

        // === Buttons ===
        startBtn.addEventListener('click', function(e) {
            e.preventDefault();
            startGame();
        });

        newGameBtn.addEventListener('click', function(e) {
            e.preventDefault();
            resetGame();
        });

        // === Init ===
        drawButtons();
    })();
    </script>
</body>
</html>
