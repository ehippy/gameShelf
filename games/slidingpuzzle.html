<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>gameShelf — Sliding Tile Puzzle</title>
    <link rel="stylesheet" href="../styles.css">
    <style>
        /* ── CSS Custom Properties ───────────────────────────── */
        :root {
            --bg-primary: #0f0f23;
            --bg-secondary: #1a1a3e;
            --bg-card: #1e1e45;
            --text-primary: #e0e0e0;
            --text-secondary: #a0a0b8;
            --text-muted: #6b6b80;
            --accent: #00d4ff;
            --accent-hover: #00b8d9;
            --accent-glow: rgba(0, 212, 255, 0.3);
            --border-color: #2a2a5a;
            --header-bg: rgba(15, 15, 35, 0.95);
            --footer-bg: #0a0a1a;
        }

        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        .game-header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: var(--header-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            padding: 0.75rem 1.5rem;
        }

        .header-inner {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: var(--accent);
            text-shadow: 0 0 10px var(--accent-glow);
            white-space: nowrap;
            transition: text-shadow 0.2s ease;
        }

        .logo:hover {
            text-shadow: 0 0 20px var(--accent-glow), 0 0 40px rgba(0, 212, 255, 0.1);
        }

        .logo::before {
            content: '🎮';
            margin-right: 0.35rem;
        }

        .game-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .back-link {
            color: var(--accent);
            font-size: 0.9rem;
            font-weight: 500;
            transition: color 0.2s ease;
            white-space: nowrap;
        }

        .back-link:hover {
            color: var(--accent-hover);
            text-shadow: 0 0 10px var(--accent-glow);
        }

        /* Game Area */
        .game-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem 1.5rem;
        }

        /* Difficulty selector */
        .difficulty-bar {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .difficulty-label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .difficulty-select {
            background: var(--bg-card);
            color: var(--text-primary);
            border: 2px solid var(--border-color);
            border-radius: 0.5rem;
            padding: 0.35rem 0.75rem;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .difficulty-select:hover,
        .difficulty-select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 10px var(--accent-glow);
        }

        .difficulty-select option {
            background: var(--bg-card);
            color: var(--text-primary);
        }

        /* Score / HUD Bar */
        .score-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 2rem;
            margin-bottom: 1.5rem;
            width: 400px;
            padding: 0.5rem 1rem;
            background: var(--bg-secondary);
            border: 2px solid var(--border-color);
            border-radius: 0.5rem;
        }

        .score-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            min-width: 60px;
        }

        .score-label {
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
        }

        .score-value {
            font-size: 1.8rem;
            font-weight: 800;
            font-family: 'Courier New', Courier, monospace;
            color: #4ade80;
            text-shadow: 0 0 10px rgba(74, 222, 128, 0.4);
            min-width: 60px;
            text-align: center;
        }

        .score-value.timer-value {
            color: #fbbf24;
            text-shadow: 0 0 10px rgba(251, 191, 36, 0.4);
        }

        .smiley-btn {
            font-size: 1.8rem;
            background: var(--bg-card);
            border: 2px solid var(--border-color);
            border-radius: 0.375rem;
            cursor: pointer;
            padding: 0.15rem 0.4rem;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            line-height: 1;
        }

        .smiley-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .smiley-btn:active {
            transform: scale(0.95);
        }

        /* Canvas */
        .canvas-wrapper {
            position: relative;
            border: 2px solid var(--border-color);
            border-radius: 0.75rem;
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.1), 0 8px 24px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            max-width: 100%;
        }

        canvas {
            display: block;
            background-color: #1a1a3e;
            max-width: 100%;
            height: auto;
        }

        /* Overlay (Shuffle / Win) */
        .overlay {
            position: absolute;
            inset: 0;
            background: rgba(15, 15, 35, 0.92);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            z-index: 10;
            border-radius: 0.75rem;
            transition: opacity 0.3s ease;
        }

        .overlay.hidden {
            display: none;
        }

        .overlay-title {
            font-size: 2rem;
            font-weight: 800;
            color: var(--text-primary);
            text-shadow: 0 0 20px var(--accent-glow);
        }

        .overlay-subtitle {
            font-size: 0.95rem;
            color: var(--text-secondary);
            text-align: center;
            max-width: 280px;
            line-height: 1.5;
        }

        .overlay-score {
            font-size: 1.3rem;
            font-weight: 700;
            color: #fbbf24;
            margin: 0.25rem 0;
        }

        /* Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            background: var(--accent);
            color: var(--bg-primary);
            font-size: 1rem;
            font-weight: 700;
            padding: 0.5rem 2rem;
            border-radius: 0.75rem;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.15);
            margin-top: 0.5rem;
        }

        .btn:hover {
            background: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        /* Footer */
        .site-footer {
            margin-top: auto;
            background: var(--footer-bg);
            border-top: 1px solid var(--border-color);
            padding: 2rem 1.5rem;
        }

        .footer-inner {
            max-width: 1200px;
            margin: 0 auto;
            text-align: center;
        }

        .footer-links {
            display: flex;
            justify-content: center;
            gap: 3rem;
            margin-bottom: 0.5rem;
        }

        .footer-links a {
            color: var(--text-muted);
            font-size: 0.85rem;
            transition: color 0.2s ease;
        }

        .footer-links a:hover {
            color: var(--accent);
        }

        .site-footer p {
            color: var(--text-muted);
            font-size: 0.8rem;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .header-inner {
                justify-content: center;
                text-align: center;
            }
            .score-bar {
                width: 320px;
                gap: 0.5rem;
            }
            .overlay-title {
                font-size: 1.5rem;
            }
            .difficulty-bar {
                flex-direction: column;
                gap: 0.5rem;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="game-header">
        <div class="header-inner">
            <div class="header-left">
                <a href="../index.html" class="logo">gameShelf</a>
                <span class="game-title">Sliding Tile Puzzle</span>
            </div>
            <a href="../index.html" class="back-link">← Back to All Games</a>
        </div>
    </header>

    <!-- Game Area -->
    <div class="game-area">
        <!-- Difficulty Selector -->
        <div class="difficulty-bar">
            <label class="difficulty-label" for="difficultySelect">Difficulty:</label>
            <select id="difficultySelect" class="difficulty-select">
                <option value="3">Easy (3×3)</option>
                <option value="4" selected>Normal (4×4)</option>
                <option value="5">Hard (5×5)</option>
            </select>
        </div>

        <!-- HUD Bar -->
        <div class="score-bar">
            <div class="score-item">
                <span class="score-label">Moves</span>
                <span class="score-value" id="moveCounter">0</span>
            </div>
            <button class="smiley-btn" id="smileyBtn" title="Restart game">😀</button>
            <div class="score-item">
                <span class="score-label">Time</span>
                <span class="score-value timer-value" id="timer">00:00</span>
            </div>
        </div>

        <!-- Canvas -->
        <div class="canvas-wrapper">
            <canvas id="gameCanvas" width="400" height="400"></canvas>

            <!-- Shuffle Overlay -->
            <div class="overlay" id="shuffleOverlay">
                <div class="overlay-title">🧩 Shuffling...</div>
                <div class="overlay-subtitle">Randomizing tiles — this ensures the puzzle is always solvable.</div>
            </div>

            <!-- Win Overlay -->
            <div class="overlay hidden" id="winOverlay">
                <div class="overlay-title">🎉 You Win!</div>
                <div class="overlay-score" id="winTime">Time: 00:00</div>
                <div class="overlay-score" id="winMoves">Moves: 0</div>
                <div class="overlay-subtitle">All tiles arranged in order!</div>
                <button class="btn" id="playAgainBtn">↻ Play Again</button>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="site-footer">
        <div class="footer-inner">
            <div class="footer-links">
                <a href="../index.html">Home</a>
                <a href="../index.html">All Games</a>
            </div>
            <p>© 2025 gameShelf — All games built in browser — no downloads required</p>
        </div>
    </footer>

    <script src="../script.js"></script>
    <script>
    (function() {
        'use strict';

        // ── Constants ──
        var CANVAS_SIZE = 400;

        var SHUFFLE_MOVES = {
            3: 200,
            4: 300,
            5: 400
        };

        // ── DOM refs ──
        var canvas = document.getElementById('gameCanvas');
        var ctx = canvas.getContext('2d');
        var moveCounterEl = document.getElementById('moveCounter');
        var timerEl = document.getElementById('timer');
        var smileyBtn = document.getElementById('smileyBtn');
        var difficultySelect = document.getElementById('difficultySelect');
        var shuffleOverlay = document.getElementById('shuffleOverlay');
        var winOverlay = document.getElementById('winOverlay');
        var winTimeEl = document.getElementById('winTime');
        var winMovesEl = document.getElementById('winMoves');
        var playAgainBtn = document.getElementById('playAgainBtn');

        // ── Game State ──
        var grid = [];        // 1D array of size*size, values: tile number or 0 for empty
        var gridSize = 4;     // current grid dimension
        var emptyPos = 0;     // position of the empty tile
        var moves = 0;
        var timerSeconds = 0;
        var timerInterval = null;
        var gameState = 'idle'; // 'idle', 'shuffling', 'playing', 'won'

        // ── Tile colors (dark theme) ──
        function getTileColor(value) {
            // Gradient effect: lighter tiles for smaller numbers
            var intensity = Math.min(value / 15, 1);
            var r = Math.round(30 + intensity * 40);
            var g = Math.round(30 + intensity * 30);
            var b = Math.round(60 + intensity * 50);
            return 'rgb(' + r + ',' + g + ',' + b + ')';
        }

        function getTileTextColor(value) {
            return '#e0e0e0';
        }

        // ── Initialize solved state ──
        function initGrid(size) {
            gridSize = size;
            var total = size * size;
            grid = [];
            for (var i = 0; i < total - 1; i++) {
                grid[i] = i + 1; // tiles 1 through total-1
            }
            grid[total - 1] = 0; // empty tile at bottom-right
            emptyPos = total - 1;
        }

        // ── Get row/col from linear position ──
        function rowOf(pos) {
            return Math.floor(pos / gridSize);
        }

        function colOf(pos) {
            return pos % gridSize;
        }

        // ── Check if two positions are adjacent ──
        function isAdjacent(a, b) {
            var ar = rowOf(a), ac = colOf(a);
            var br = rowOf(b), bc = colOf(b);
            return (Math.abs(ar - br) + Math.abs(ac - bc)) === 1;
        }

        // ── Check if a move in a direction is valid (empty can move) ──
        function canMove(pos, dr, dc) {
            var r = rowOf(pos);
            var c = colOf(pos);
            var nr = r + dr;
            var nc = c + dc;
            return nr >= 0 && nr < gridSize && nc >= 0 && nc < gridSize;
        }

        // ── Slide tile into empty space (swap empty with adjacent tile) ──
        function slideTile(dir) {
            // dir: 'up', 'down', 'left', 'right'
            // Moving a tile into the empty space means:
            //   - Arrow Up: tile above moves down → empty moves up
            //   - Arrow Down: tile below moves up → empty moves down
            //   - Arrow Left: tile to left moves right → empty moves left
            //   - Arrow Right: tile to right moves left → empty moves right
            var dr = 0, dc = 0;
            if (dir === 'up') dr = -1;
            if (dir === 'down') dr = 1;
            if (dir === 'left') dc = -1;
            if (dir === 'right') dc = 1;

            var er = rowOf(emptyPos);
            var ec = colOf(emptyPos);
            var nr = er + dr;
            var nc = ec + dc;

            if (nr < 0 || nr >= gridSize || nc < 0 || nc >= gridSize) return false;

            var newPos = nr * gridSize + nc;
            // Swap
            grid[emptyPos] = grid[newPos];
            grid[newPos] = 0;
            emptyPos = newPos;
            return true;
        }

        // ── Shuffle: perform random valid moves from solved state ──
        function shuffle(callback) {
            gameState = 'shuffling';
            shuffleOverlay.classList.remove('hidden');
            winOverlay.classList.add('hidden');

            var count = SHUFFLE_MOVES[gridSize] || 300;
            var dirMap = [{dr: -1, dc: 0}, {dr: 1, dc: 0}, {dr: 0, dc: -1}, {dr: 0, dc: 1}];

            var lastDr = 0, lastDc = 0;
            var completed = 0;

            function doOneMove() {
                // Get valid directions for empty position
                var valid = [];
                for (var i = 0; i < dirMap.length; i++) {
                    if (canMove(emptyPos, dirMap[i].dr, dirMap[i].dc)) {
                        // Avoid reversing last move to make shuffling more effective
                        if (!(dirMap[i].dr === -lastDr && dirMap[i].dc === -lastDc)) {
                            valid.push(dirMap[i]);
                        }
                    }
                }
                // If no non-reverse moves, allow any valid
                if (valid.length === 0) {
                    for (var i = 0; i < dirMap.length; i++) {
                        if (canMove(emptyPos, dirMap[i].dr, dirMap[i].dc)) {
                            valid.push(dirMap[i]);
                        }
                    }
                }

                var choice = valid[Math.floor(Math.random() * valid.length)];
                lastDr = choice.dr;
                lastDc = choice.dc;

                var er = rowOf(emptyPos);
                var ec = colOf(emptyPos);
                var newPos = (er + choice.dr) * gridSize + (ec + choice.dc);
                grid[emptyPos] = grid[newPos];
                grid[newPos] = 0;
                emptyPos = newPos;

                completed++;
                if (completed < count) {
                    setTimeout(doOneMove, 0);
                } else {
                    moves = 0;
                    timerSeconds = 0;
                    moveCounterEl.textContent = '0';
                    timerEl.textContent = '00:00';
                    smileyBtn.textContent = '😀';
                    gameState = 'idle';
                    shuffleOverlay.classList.add('hidden');
                    render();
                    if (callback) callback();
                }
            }

            setTimeout(doOneMove, 0);
        }

        // ── Timer ──
        function startTimer() {
            stopTimer();
            timerInterval = setInterval(function() {
                timerSeconds++;
                var mins = Math.floor(timerSeconds / 60);
                var secs = timerSeconds % 60;
                timerEl.textContent = mins.toString().padStart(2, '0') + ':' + secs.toString().padStart(2, '0');
            }, 1000);
        }

        function stopTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
        }

        // ── Check win condition ──
        function checkWin() {
            for (var i = 0; i < grid.length - 1; i++) {
                if (grid[i] !== i + 1) return false;
            }
            return grid[grid.length - 1] === 0;
        }

        // ── Rendering ──
        var rafId = null;
        var needsRender = false;

        function render() {
            needsRender = true;
            if (!rafId) {
                rafId = requestAnimationFrame(function() {
                    rafId = null;
                    draw();
                });
            }
        }

        function draw() {
            ctx.clearRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);

            var cellSize = CANVAS_SIZE / gridSize;
            var padding = 2;

            // Draw grid background
            ctx.fillStyle = '#0d0d20';
            ctx.fillRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);

            // Draw each tile
            for (var pos = 0; pos < grid.length; pos++) {
                if (grid[pos] === 0) continue; // skip empty

                var r = rowOf(pos);
                var c = colOf(pos);
                var x = c * cellSize + padding;
                var y = r * cellSize + padding;
                var w = cellSize - padding * 2;
                var h = cellSize - padding * 2;

                // Tile fill
                ctx.fillStyle = getTileColor(grid[pos]);
                ctx.fillRect(x, y, w, h);

                // Tile border
                ctx.strokeStyle = '#4a4a7a';
                ctx.lineWidth = 2;
                ctx.strokeRect(x, y, w, h);

                // Inner highlight (subtle)
                ctx.fillStyle = 'rgba(255, 255, 255, 0.08)';
                ctx.fillRect(x + 2, y + 2, w - 4, h / 3);

                // Number text
                var fontSize = Math.max(14, Math.min(28, Math.round(cellSize * 0.4)));
                ctx.fillStyle = getTileTextColor(grid[pos]);
                ctx.font = 'bold ' + fontSize + 'px -apple-system, BlinkMacSystemFont, sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(grid[pos].toString(), x + w / 2, y + h / 2 + 1);
            }

            // Draw empty cell (darker area at emptyPos)
            if (grid[emptyPos] === 0) {
                var er = rowOf(emptyPos);
                var ec = colOf(emptyPos);
                ctx.fillStyle = '#0a0a1a';
                ctx.fillRect(ec * cellSize, er * cellSize, cellSize, cellSize);
            }
        }

        // ── Handle player move ──
        function playerMove(dir) {
            if (gameState !== 'playing') return;

            var slid = slideTile(dir);
            if (!slid) return;

            moves++;
            moveCounterEl.textContent = moves.toString();

            // Start timer on first move
            if (moves === 1) {
                startTimer();
            }

            render();

            // Check win
            if (checkWin()) {
                gameState = 'won';
                stopTimer();
                smileyBtn.textContent = '😎';
                winTimeEl.textContent = 'Time: ' + timerEl.textContent;
                winMovesEl.textContent = 'Moves: ' + moves;
                winOverlay.classList.remove('hidden');
                render();
            }
        }

        // ── Keyboard Input ──
        document.addEventListener('keydown', function(e) {
            if (gameState !== 'playing') return;

            var handled = false;
            if (e.code === 'ArrowUp') { playerMove('up'); handled = true; }
            if (e.code === 'ArrowDown') { playerMove('down'); handled = true; }
            if (e.code === 'ArrowLeft') { playerMove('left'); handled = true; }
            if (e.code === 'ArrowRight') { playerMove('right'); handled = true; }

            if (handled) {
                e.preventDefault();
            }
        });

        // ── Mouse / Touch Input ──
        canvas.addEventListener('click', function(e) {
            if (gameState !== 'playing') return;
            e.preventDefault();

            var rect = canvas.getBoundingClientRect();
            var scaleX = CANVAS_SIZE / rect.width;
            var scaleY = CANVAS_SIZE / rect.height;
            var mx = (e.clientX - rect.left) * scaleX;
            var my = (e.clientY - rect.top) * scaleY;
            var cellSize = CANVAS_SIZE / gridSize;
            var clickedCol = Math.floor(mx / cellSize);
            var clickedRow = Math.floor(my / cellSize);

            if (clickedCol < 0 || clickedCol >= gridSize || clickedRow < 0 || clickedRow >= gridSize) return;

            var clickedPos = clickedRow * gridSize + clickedCol;

            // Check if the clicked tile is adjacent to the empty space
            if (isAdjacent(clickedPos, emptyPos)) {
                // Determine which direction the tile needs to move
                // If we clicked left of empty, tile moves right
                // If we clicked above empty, tile moves down
                var dr = rowOf(clickedPos) - rowOf(emptyPos);
                var dc = colOf(clickedPos) - colOf(emptyPos);
                if (dr === -1) playerMove('down');
                if (dr === 1) playerMove('up');
                if (dc === -1) playerMove('right');
                if (dc === 1) playerMove('left');
            }
        });

        // Prevent right-click context menu
        canvas.addEventListener('contextmenu', function(e) {
            e.preventDefault();
        });

        // ── Restart / Play Again ──
        function restart() {
            stopTimer();
            moves = 0;
            timerSeconds = 0;
            moveCounterEl.textContent = '0';
            timerEl.textContent = '00:00';
            smileyBtn.textContent = '😀';
            winOverlay.classList.add('hidden');
            initGrid(gridSize);
            shuffle();
        }

        smileyBtn.addEventListener('click', function() {
            restart();
        });

        playAgainBtn.addEventListener('click', function() {
            restart();
        });

        // ── Difficulty Change ──
        difficultySelect.addEventListener('change', function() {
            gridSize = parseInt(this.value, 10);
            initGrid(gridSize);
            restart();
        });

        // ── Initialize ──
        initGrid(parseInt(difficultySelect.value, 10));
        render();

    })();
    </script>
</body>
</html>
