name: 'Single Deploy Attempt'
description: 'Uploads artifact and deploys to GitHub Pages for one attempt. Fails if anything goes wrong. Retries up to 5 attempts on transient failure.'

inputs:
  attempt:
    description: 'Which attempt number (1 through 5)'
    required: true
  artifact_path:
    description: 'Path to the artifact directory'
    required: true
    default: './dist/'

outputs:
  page_url:
    description: 'The URL of the deployed GitHub Pages site'
    value: ${{ steps.deploy.outputs.page_url }}

runs:
  using: 'composite'
  steps:
    - name: Pre-check GitHub API reachability
      shell: bash
      run: |
        echo "Pre-checking GitHub API reachability..."
        HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
          --max-time 10 \
          "https://api.github.com/repos/${{ github.repository }}")
        if [ "$HTTP_CODE" != "200" ] && [ "$HTTP_CODE" != "403" ]; then
          echo "ERROR: GitHub API endpoint is not reachable (HTTP $HTTP_CODE)."
          echo "The endpoint may be completely down — not wasting retries."
          exit 1
        fi
        echo "GitHub API is reachable (HTTP $HTTP_CODE). Proceeding with deployment."

    - name: Wait before retry
      shell: bash
      if: inputs.attempt != '1'
      run: |
        case ${{ inputs.attempt }} in
          2) echo "Waiting 30 seconds before retry attempt 2/5..."; sleep 30 ;;
          3) echo "Waiting 60 seconds before retry attempt 3/5..."; sleep 60 ;;
          4) echo "Waiting 120 seconds before retry attempt 4/5..."; sleep 120 ;;
          5) echo "Waiting 180 seconds before retry attempt 5/5..."; sleep 180 ;;
        esac

    # Upload the artifact
    - name: Upload artifact (attempt ${{ inputs.attempt }})
      id: upload
      uses: actions/upload-pages-artifact@v3
      with:
        path: ${{ inputs.artifact_path }}

    # Deploy to GitHub Pages
    - name: Deploy to GitHub Pages (attempt ${{ inputs.attempt }})
      id: deploy
      uses: actions/deploy-pages@v4
