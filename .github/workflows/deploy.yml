name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Deploy to GitHub Pages (with retry)
        run: |
          MAX_ATTEMPTS=3
          ATTEMPT=0
          DEPLOY_SUCCESS=false

          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            ATTEMPT=$((ATTEMPT + 1))
            echo "=== Attempt $ATTEMPT/$MAX_ATTEMPTS ==="

            # Upload the artifact
            echo "Uploading artifact..."
            npx actions/upload-pages-artifact@v3 --path './dist/'
            UPLOAD_EXIT=$?

            if [ $UPLOAD_EXIT -ne 0 ]; then
              echo "Artifact upload failed (exit code $UPLOAD_EXIT)"
              if [ $ATTEMPT -lt $MAX_ATTEMPTS ]; then
                echo "Waiting 30 seconds before retry..."
                sleep 30
                continue
              fi
              echo "Artifact upload failed after $MAX_ATTEMPTS attempts."
              exit 1
            fi

            # Deploy to GitHub Pages
            echo "Deploying to GitHub Pages..."
            npx actions/deploy-pages@v4
            DEPLOY_EXIT=$?

            if [ $DEPLOY_EXIT -ne 0 ]; then
              echo "Deployment failed (exit code $DEPLOY_EXIT)"
              if [ $ATTEMPT -lt $MAX_ATTEMPTS ]; then
                echo "Waiting 30 seconds before retry..."
                sleep 30
                continue
              fi
              echo "Deployment failed after $MAX_ATTEMPTS attempts."
              exit 1
            fi

            DEPLOY_SUCCESS=true
            echo "=== Deployment successful on attempt $ATTEMPT ==="
            break
          done

          if [ "$DEPLOY_SUCCESS" != "true" ]; then
            echo "Deployment failed after $MAX_ATTEMPTS attempts."
            exit 1
          fi
        id: deployment
